# DCO: todo commit do pull request diz que o autor tem direito de contribuir aquele código.
#
# É o `Signed-off-by:` que o `git commit -s` escreve. Roda em pull_request (NUNCA em
# pull_request_target, que daria ao código do fork o token com escrita), não lê segredo e
# só tem permissão de leitura. O texto do DCO está no CONTRIBUTING.md.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Todo commit tem Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          falta=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: .* <.*@.*>$'; then
              echo "::error::commit ${c:0:8} sem Signed-off-by. Refaça com: git commit --amend -s (ou git rebase --signoff)"
              falta=1
            fi
          done
          exit $falta
