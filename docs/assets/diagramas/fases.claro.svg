<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fases do AI-DLC e aprovação humana">
<rect width="1200" height="680" fill="#ffffff"/>
<defs><marker id="ponta-roxo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#0f172a">As fases do AI-DLC e onde a aprovação humana fica</text>
<text x="32" y="68" font-size="13" fill="#475569">Interpretação do kit sobre o AI-DLC da AWS. Os artefatos moram no repositório, não numa ferramenta.</text>
<rect x="40" y="100" width="340" height="330" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="54" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">INCEPTION</text>
<text x="60" y="150" font-size="13" text-anchor="start" fill="#0f172a" font-weight="700">A IA pergunta, a equipe responde</text>
<g><rect x="60" y="170" width="300" height="70" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="72" y="194" font-size="15" font-weight="700" fill="#0f172a">aidlc/inception/</text><text x="72" y="214" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">requirements.md</text></g>
<g><rect x="60" y="250" width="300" height="70" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="72" y="274" font-size="15" font-weight="700" fill="#0f172a">aidlc/inception/</text><text x="72" y="294" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">units-of-work.md</text></g>
<g><rect x="60" y="330" width="300" height="84" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="72" y="354" font-size="15" font-weight="700" fill="#0f172a">/inception</text><text x="72" y="374" font-size="12" fill="#475569">conduz a elaboração com a</text><text x="72" y="391" font-size="12" fill="#475569">equipe, sem inventar resposta</text></g>
<rect x="430" y="100" width="340" height="330" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
<text x="444" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">CONSTRUCTION</text>
<text x="450" y="150" font-size="13" text-anchor="start" fill="#0f172a" font-weight="700">Bolts curtos, uma unidade por vez</text>
<g><rect x="450" y="170" width="300" height="70" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="462" y="194" font-size="15" font-weight="700" fill="#0f172a">aidlc/construction/</text><text x="462" y="214" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">design.md</text></g>
<g><rect x="450" y="250" width="300" height="70" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="462" y="274" font-size="15" font-weight="700" fill="#0f172a">Teste, implementação, gate</text><text x="462" y="294" font-size="12" fill="#475569">aidlc-gate com evidência crua</text></g>
<g><rect x="450" y="330" width="300" height="84" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="462" y="354" font-size="15" font-weight="700" fill="#0f172a">/construction</text><text x="462" y="374" font-size="12" fill="#475569">uma unidade por bolt;</text><text x="462" y="391" font-size="12" fill="#475569">gate verde antes de fechar</text></g>
<rect x="820" y="100" width="340" height="330" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="834" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">OPERATIONS</text>
<text x="840" y="150" font-size="13" text-anchor="start" fill="#0f172a" font-weight="700">A parte mais fina do kit</text>
<g><rect x="840" y="170" width="300" height="70" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="852" y="194" font-size="15" font-weight="700" fill="#0f172a">Entrega e observação</text><text x="852" y="214" font-size="12" fill="#475569">fica com o seu processo</text></g>
<g><rect x="840" y="250" width="300" height="70" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="852" y="274" font-size="15" font-weight="700" fill="#0f172a">aidlc-cycle</text><text x="852" y="294" font-size="12" fill="#475569">mede horas entre as fases</text></g>
<g><rect x="840" y="330" width="300" height="80" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="852" y="354" font-size="15" font-weight="700" fill="#0f172a">aidlc-limpeza</text><text x="852" y="374" font-size="12" fill="#475569">fecha a unidade sem sobras</text></g>
<path d="M380 265 L430 265" fill="none" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#ponta-roxo)"/>
<path d="M770 265 L820 265" fill="none" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#ponta-roxo)"/>
<rect x="386" y="232" width="57" height="22" rx="11" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/><text x="395" y="247" font-size="11" fill="#0f172a">aprova</text>
<rect x="776" y="232" width="57" height="22" rx="11" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/><text x="785" y="247" font-size="11" fill="#0f172a">aprova</text>
<rect x="40" y="460" width="1120" height="190" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="54" y="482" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">AIDLC-PHASE: A TRAVA ENTRE AS FASES</text>
<g><rect x="60" y="495" width="340" height="135" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="72" y="519" font-size="15" font-weight="700" fill="#0f172a">aidlc-phase check &lt;fase&gt;</text><text x="72" y="539" font-size="12" fill="#475569">reprova enquanto houver campo</text><text x="72" y="556" font-size="12" fill="#475569">por preencher ou aprovação em</text><text x="72" y="573" font-size="12" fill="#475569">branco no artefato</text></g>
<g><rect x="420" y="495" width="340" height="135" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/><text x="432" y="519" font-size="15" font-weight="700" fill="#0f172a">A pessoa assina no arquivo</text><text x="432" y="539" font-size="12" fill="#475569">Aprovado por: e Data: no fim do</text><text x="432" y="556" font-size="12" fill="#475569">artefato; o check recusa nome</text><text x="432" y="573" font-size="12" fill="#475569">de IA, então só pessoa aprova</text></g>
<g><rect x="780" y="495" width="360" height="135" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="792" y="519" font-size="15" font-weight="700" fill="#0f172a">aidlc-phase status</text><text x="792" y="539" font-size="12" fill="#475569">mostra em que fase o projeto</text><text x="792" y="556" font-size="12" fill="#475569">está e o que impede a próxima</text><text x="792" y="573" font-size="12" fill="#475569">(read-only)</text></g>
</svg>
