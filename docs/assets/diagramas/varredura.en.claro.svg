<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Scan contract">
<rect width="1200" height="680" fill="#ffffff"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#0f172a">Scan contract: any security platform</text>
<text x="32" y="68" font-size="13" fill="#475569">The kit does not bundle a scanner. It enforces the result of one, and separates &quot;clean&quot; from &quot;did not run&quot;.</text>
<rect x="40" y="100" width="300" height="360" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="54" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">PLATFORMS (JSON REPORT)</text>
<g><rect x="55" y="135" width="270" height="90" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="67" y="159" font-size="15" font-weight="700" fill="#0f172a">RoqueShield</text><text x="67" y="179" font-size="12" fill="#475569">AI Fix Bundle</text><text x="67" y="196" font-size="12" fill="#475569">scan.scanners_executed/failed</text></g>
<g><rect x="55" y="245" width="270" height="90" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="67" y="269" font-size="15" font-weight="700" fill="#0f172a">Any SARIF 2.1.0</text><text x="67" y="289" font-size="12" fill="#475569">Semgrep, CodeQL, Snyk,</text><text x="67" y="306" font-size="12" fill="#475569">Sonar, Trivy</text></g>
<g><rect x="55" y="355" width="270" height="90" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="67" y="379" font-size="15" font-weight="700" fill="#0f172a">Neutral format</text><text x="67" y="399" font-size="12" fill="#475569">coverage_complete,</text><text x="67" y="416" font-size="12" fill="#475569">scanners_ran, findings</text></g>
<rect x="400" y="100" width="380" height="360" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="414" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">AIDLC-SCAN</text>
<g><rect x="420" y="135" width="340" height="90" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="432" y="159" font-size="15" font-weight="700" fill="#0f172a">1. Normalizes</text><text x="432" y="179" font-size="12" fill="#475569">format, scanners, coverage,</text><text x="432" y="196" font-size="12" fill="#475569">findings with a stable key</text></g>
<g><rect x="420" y="245" width="340" height="90" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="432" y="269" font-size="15" font-weight="700" fill="#0f172a">2. Checks coverage</text><text x="432" y="289" font-size="12" fill="#475569">complete? did the required scanner run?</text><text x="432" y="306" font-size="12" fill="#475569">and the baseline too?</text></g>
<g><rect x="420" y="355" width="340" height="90" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="432" y="379" font-size="15" font-weight="700" fill="#0f172a">3. Applies the threshold</text><text x="432" y="399" font-size="12" fill="#475569">--fail-on high (default)</text><text x="432" y="416" font-size="12" fill="#475569">--baseline shows what changed</text></g>
<path d="M325 180 L372 180 L372 180 L420 180" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M325 290 L372 290 L372 180 L420 180" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ponta-suave)"/>
<path d="M325 400 L372 400 L372 180 L420 180" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ponta-suave)"/>
<rect x="840" y="100" width="320" height="360" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="854" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">EXIT CODE</text>
<g><rect x="855" y="135" width="290" height="90" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="867" y="159" font-size="15" font-weight="700" fill="#0f172a">0  clean</text><text x="867" y="179" font-size="12" fill="#475569">full coverage and nothing</text><text x="867" y="196" font-size="12" fill="#475569">at or above the threshold</text></g>
<g><rect x="855" y="245" width="290" height="90" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="867" y="269" font-size="15" font-weight="700" fill="#0f172a">1  failed</text><text x="867" y="289" font-size="12" fill="#475569">finding at or above the threshold</text></g>
<g><rect x="855" y="355" width="290" height="90" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="867" y="379" font-size="15" font-weight="700" fill="#0f172a">2  did not run</text><text x="867" y="399" font-size="12" fill="#475569">incomplete or unknown</text><text x="867" y="416" font-size="12" fill="#475569">coverage: never clean</text></g>
<path d="M760 180 L855 180" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M760 290 L855 290" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M760 400 L855 400" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="40" y="500" width="540" height="150" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="52" y="524" font-size="15" font-weight="700" fill="#0f172a">In the manifest, it is an ordinary gate</text><text x="52" y="544" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{ &quot;id&quot;: &quot;scan&quot;, &quot;blocking&quot;: true,</text><text x="52" y="561" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  &quot;cmd&quot;: &quot;aidlc-scan reports/seguranca.json</text><text x="52" y="578" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">          --require-scanners semgrep,trivy&quot; }</text></g>
<g><rect x="620" y="500" width="540" height="150" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="632" y="524" font-size="15" font-weight="700" fill="#0f172a">Why 2 and not 1</text><text x="632" y="544" font-size="12" fill="#475569">An empty report can mean &quot;nothing found&quot;</text><text x="632" y="561" font-size="12" fill="#475569">or &quot;the scanner crashed&quot;. Without telling them apart,</text><text x="632" y="578" font-size="12" fill="#475569">a platform that is down looks like a clean codebase.</text></g>
</svg>
