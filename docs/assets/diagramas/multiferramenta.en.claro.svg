<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="One source, 15 AI tools">
<rect width="1200" height="570" fill="#ffffff"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4d57"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#07080f">One source, 15 AI tools</text>
<text x="32" y="68" font-size="13" fill="#4a4d57">The method lives in one place; aidlc-init generates each tool's layer, and CI fails on drift.</text>
<g><rect x="40" y="160" width="300" height="120" rx="9" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.4"/><text x="52" y="184" font-size="15" font-weight="700" fill="#07080f">The source</text><text x="52" y="204" font-size="12" fill="#4a4d57">AGENTS.md: the rules</text><text x="52" y="221" font-size="12" fill="#4a4d57">.agents/skills: the method of</text><text x="52" y="238" font-size="12" fill="#4a4d57">each phase (Inception, Construction)</text></g>
<g><rect x="400" y="165" width="260" height="110" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="412" y="189" font-size="15" font-weight="700" fill="#07080f">aidlc-init</text><text x="412" y="209" font-size="12" fill="#4a4d57">generates command, skill and hook</text><text x="412" y="226" font-size="12" fill="#4a4d57">in each tool's own format;</text><text x="412" y="243" font-size="12" fill="#4a4d57">--check and --sync</text></g>
<path d="M340 220 L400 220" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="740" y="100" width="420" height="90" rx="9" fill="#e3f6e8" stroke="#1a7f37" stroke-width="1.4"/><text x="752" y="124" font-size="15" font-weight="700" fill="#07080f">Question window and hooks</text><text x="752" y="144" font-size="12" fill="#4a4d57">Claude Code (plugin);</text><text x="752" y="161" font-size="12" fill="#4a4d57">GitHub Copilot, Cursor and Codex (aidlc-hook)</text></g>
<g><rect x="740" y="215" width="420" height="90" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="752" y="239" font-size="15" font-weight="700" fill="#07080f">Question window; CI enforces</text><text x="752" y="259" font-size="12" fill="#4a4d57">OpenCode, Kilo Code, Gemini CLI, Antigravity,</text><text x="752" y="276" font-size="12" fill="#4a4d57">Devin, Junie, Cline, Continue</text></g>
<g><rect x="740" y="330" width="420" height="90" rx="9" fill="#fdf0d8" stroke="#9a5b00" stroke-width="1.4"/><text x="752" y="354" font-size="15" font-weight="700" fill="#07080f">Questions in text; CI enforces</text><text x="752" y="374" font-size="12" fill="#4a4d57">Kiro, Augment and Zed: lettered options,</text><text x="752" y="391" font-size="12" fill="#4a4d57">the recommended one marked, ok accepts all</text></g>
<path d="M660 220 L700 220 L700 145 L740 145" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M700 220 L700 260 L740 260" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M700 260 L700 375 L740 375" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="40" y="450" width="1120" height="80" rx="9" fill="#fdf0d8" stroke="#9a5b00" stroke-width="1.4"/><text x="52" y="474" font-size="15" font-weight="700" fill="#07080f">In CI, in all of them (aidlc-gate.yml)</text><text x="52" y="494" font-size="12" fill="#4a4d57">runs aidlc-identity, aidlc-init --check, aidlc-phase and aidlc-gate on every push: this is what enforces where the tool has no hook</text></g>
</svg>
