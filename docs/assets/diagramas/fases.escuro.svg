<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fases do AI-DLC e aprovação humana">
<rect width="1200" height="680" fill="#07080f"/>
<defs><marker id="ponta-roxo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b96f0"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#f2f4fa">As fases do AI-DLC e onde a aprovação humana fica</text>
<text x="32" y="68" font-size="13" fill="#b0b2b8">Interpretação do kit sobre o AI-DLC da AWS. Os artefatos moram no repositório, não numa ferramenta.</text>
<rect x="40" y="100" width="340" height="330" rx="12" fill="#0a1a36" stroke="#3d96ff" stroke-width="1.2"/>
<text x="54" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#b0b2b8">INCEPTION</text>
<text x="60" y="150" font-size="13" text-anchor="start" fill="#f2f4fa" font-weight="700">A IA pergunta, a equipe responde</text>
<g><rect x="60" y="170" width="300" height="70" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="72" y="194" font-size="15" font-weight="700" fill="#f2f4fa">aidlc/inception/</text><text x="72" y="214" font-size="12" fill="#b0b2b8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">requirements.md</text></g>
<g><rect x="60" y="250" width="300" height="70" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="72" y="274" font-size="15" font-weight="700" fill="#f2f4fa">aidlc/inception/</text><text x="72" y="294" font-size="12" fill="#b0b2b8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">units-of-work.md</text></g>
<g><rect x="60" y="330" width="300" height="84" rx="9" fill="#0a1a36" stroke="#3d96ff" stroke-width="1.4"/><text x="72" y="354" font-size="15" font-weight="700" fill="#f2f4fa">/inception</text><text x="72" y="374" font-size="12" fill="#b0b2b8">conduz a elaboração com a</text><text x="72" y="391" font-size="12" fill="#b0b2b8">equipe, sem inventar resposta</text></g>
<rect x="430" y="100" width="340" height="330" rx="12" fill="#0b2214" stroke="#34c759" stroke-width="1.2"/>
<text x="444" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#b0b2b8">CONSTRUCTION</text>
<text x="450" y="150" font-size="13" text-anchor="start" fill="#f2f4fa" font-weight="700">Bolts curtos, uma unidade por vez</text>
<g><rect x="450" y="170" width="300" height="70" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="462" y="194" font-size="15" font-weight="700" fill="#f2f4fa">aidlc/construction/</text><text x="462" y="214" font-size="12" fill="#b0b2b8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">design.md</text></g>
<g><rect x="450" y="250" width="300" height="70" rx="9" fill="#0b2214" stroke="#34c759" stroke-width="1.4"/><text x="462" y="274" font-size="15" font-weight="700" fill="#f2f4fa">Teste, implementação, gate</text><text x="462" y="294" font-size="12" fill="#b0b2b8">aidlc-gate com evidência crua</text></g>
<g><rect x="450" y="330" width="300" height="84" rx="9" fill="#0b2214" stroke="#34c759" stroke-width="1.4"/><text x="462" y="354" font-size="15" font-weight="700" fill="#f2f4fa">/construction</text><text x="462" y="374" font-size="12" fill="#b0b2b8">uma unidade por bolt;</text><text x="462" y="391" font-size="12" fill="#b0b2b8">gate verde antes de fechar</text></g>
<rect x="820" y="100" width="340" height="330" rx="12" fill="#2a1d06" stroke="#f59e0b" stroke-width="1.2"/>
<text x="834" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#b0b2b8">OPERATIONS</text>
<text x="840" y="150" font-size="13" text-anchor="start" fill="#f2f4fa" font-weight="700">A parte mais fina do kit</text>
<g><rect x="840" y="170" width="300" height="70" rx="9" fill="#2a1d06" stroke="#f59e0b" stroke-width="1.4"/><text x="852" y="194" font-size="15" font-weight="700" fill="#f2f4fa">Entrega e observação</text><text x="852" y="214" font-size="12" fill="#b0b2b8">fica com o seu processo</text></g>
<g><rect x="840" y="250" width="300" height="70" rx="9" fill="#2a1d06" stroke="#f59e0b" stroke-width="1.4"/><text x="852" y="274" font-size="15" font-weight="700" fill="#f2f4fa">aidlc-cycle</text><text x="852" y="294" font-size="12" fill="#b0b2b8">mede horas entre as fases</text></g>
<g><rect x="840" y="330" width="300" height="80" rx="9" fill="#2a1d06" stroke="#f59e0b" stroke-width="1.4"/><text x="852" y="354" font-size="15" font-weight="700" fill="#f2f4fa">aidlc-limpeza</text><text x="852" y="374" font-size="12" fill="#b0b2b8">fecha a unidade sem sobras</text></g>
<path d="M380 265 L430 265" fill="none" stroke="#8b96f0" stroke-width="1.6" marker-end="url(#ponta-roxo)"/>
<path d="M770 265 L820 265" fill="none" stroke="#8b96f0" stroke-width="1.6" marker-end="url(#ponta-roxo)"/>
<rect x="386" y="232" width="57" height="22" rx="11" fill="#171a3d" stroke="#8b96f0" stroke-width="1"/><text x="395" y="247" font-size="11" fill="#f2f4fa">aprova</text>
<rect x="776" y="232" width="57" height="22" rx="11" fill="#171a3d" stroke="#8b96f0" stroke-width="1"/><text x="785" y="247" font-size="11" fill="#f2f4fa">aprova</text>
<rect x="40" y="460" width="1120" height="190" rx="12" fill="#0a0b14" stroke="#262938" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="54" y="482" font-size="12" font-weight="700" letter-spacing="0.6" fill="#b0b2b8">AIDLC-PHASE: A TRAVA ENTRE AS FASES</text>
<g><rect x="60" y="495" width="340" height="135" rx="9" fill="#2c0f0e" stroke="#ff5a52" stroke-width="1.4"/><text x="72" y="519" font-size="15" font-weight="700" fill="#f2f4fa">aidlc-phase check &lt;fase&gt;</text><text x="72" y="539" font-size="12" fill="#b0b2b8">reprova enquanto houver campo</text><text x="72" y="556" font-size="12" fill="#b0b2b8">por preencher ou aprovação em</text><text x="72" y="573" font-size="12" fill="#b0b2b8">branco no artefato</text></g>
<g><rect x="420" y="495" width="340" height="135" rx="9" fill="#171a3d" stroke="#8b96f0" stroke-width="1.4"/><text x="432" y="519" font-size="15" font-weight="700" fill="#f2f4fa">A pessoa assina no arquivo</text><text x="432" y="539" font-size="12" fill="#b0b2b8">Aprovado por: e Data: no fim do</text><text x="432" y="556" font-size="12" fill="#b0b2b8">artefato; o check recusa nome</text><text x="432" y="573" font-size="12" fill="#b0b2b8">de IA, então só pessoa aprova</text></g>
<g><rect x="780" y="495" width="360" height="135" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="792" y="519" font-size="15" font-weight="700" fill="#f2f4fa">aidlc-phase status</text><text x="792" y="539" font-size="12" fill="#b0b2b8">mostra em que fase o projeto</text><text x="792" y="556" font-size="12" fill="#b0b2b8">está e o que impede a próxima</text><text x="792" y="573" font-size="12" fill="#b0b2b8">(read-only)</text></g>
</svg>
