<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Installation">
<rect width="1200" height="600" fill="#0b1220"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#e2e8f0">Installation, from zero to the first gate</text>
<text x="32" y="68" font-size="13" fill="#94a3b8">One command per machine; then one command per project.</text>
<g><rect x="40" y="130" width="210" height="110" rx="9" fill="#13284d" stroke="#60a5fa" stroke-width="1.4"/><text x="52" y="154" font-size="15" font-weight="700" fill="#e2e8f0">Install the kit</text><text x="52" y="174" font-size="12" fill="#94a3b8">npm install -g, with</text><text x="52" y="191" font-size="12" fill="#94a3b8">the GitHub package</text></g>
<circle cx="52" cy="118" r="11" fill="#60a5fa"/><text x="52" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#0b1220">1</text>
<path d="M250 185 L266 185" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="266" y="130" width="210" height="110" rx="9" fill="#111a2e" stroke="#334155" stroke-width="1.4"/><text x="278" y="154" font-size="15" font-weight="700" fill="#e2e8f0">Plugin in Claude Code</text><text x="278" y="174" font-size="12" fill="#94a3b8">only if you use</text><text x="278" y="191" font-size="12" fill="#94a3b8">Claude Code</text></g>
<circle cx="278" cy="118" r="11" fill="#60a5fa"/><text x="278" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#0b1220">2</text>
<path d="M476 185 L492 185" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="492" y="130" width="210" height="110" rx="9" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.4"/><text x="504" y="154" font-size="15" font-weight="700" fill="#e2e8f0">aidlc-init</text><text x="504" y="174" font-size="12" fill="#94a3b8">asks for the tools and</text><text x="504" y="191" font-size="12" fill="#94a3b8">generates each one's layer</text></g>
<circle cx="504" cy="118" r="11" fill="#60a5fa"/><text x="504" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#0b1220">3</text>
<path d="M702 185 L718 185" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="718" y="130" width="210" height="110" rx="9" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.4"/><text x="730" y="154" font-size="15" font-weight="700" fill="#e2e8f0">Inception</text><text x="730" y="174" font-size="12" fill="#94a3b8">the tool's command,</text><text x="730" y="191" font-size="12" fill="#94a3b8">plus a one-line request</text></g>
<circle cx="730" cy="118" r="11" fill="#60a5fa"/><text x="730" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#0b1220">4</text>
<path d="M928 185 L944 185" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="944" y="130" width="210" height="110" rx="9" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.4"/><text x="956" y="154" font-size="15" font-weight="700" fill="#e2e8f0">doctor and gate</text><text x="956" y="174" font-size="12" fill="#94a3b8">repository score and the</text><text x="956" y="191" font-size="12" fill="#94a3b8">acceptance criteria running</text></g>
<circle cx="956" cy="118" r="11" fill="#60a5fa"/><text x="956" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#0b1220">5</text>
<g><rect x="40" y="300" width="540" height="130" rx="9" fill="#111a2e" stroke="#334155" stroke-width="1.4"/><text x="52" y="324" font-size="15" font-weight="700" fill="#e2e8f0">Just trying it</text><text x="52" y="344" font-size="12" fill="#94a3b8">npx github:roqueribeiro/aidlc-harness init</text><text x="52" y="361" font-size="12" fill="#94a3b8">runs with nothing installed; the hooks of Copilot,</text><text x="52" y="378" font-size="12" fill="#94a3b8">Cursor and Codex need the installation</text></g>
<g><rect x="620" y="300" width="540" height="130" rx="9" fill="#111a2e" stroke="#334155" stroke-width="1.4"/><text x="632" y="324" font-size="15" font-weight="700" fill="#e2e8f0">Linux, macOS and Windows</text><text x="632" y="344" font-size="12" fill="#94a3b8">npm creates each system's shortcuts;</text><text x="632" y="361" font-size="12" fill="#94a3b8">CI tests the package installation</text><text x="632" y="378" font-size="12" fill="#94a3b8">on all three, on every push</text></g>
<g><rect x="40" y="470" width="1120" height="100" rx="9" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.4"/><text x="52" y="494" font-size="15" font-weight="700" fill="#e2e8f0">No runtime dependencies</text><text x="52" y="514" font-size="12" fill="#94a3b8">The kit is plain Node: it installs no third-party package. Requires Node 20.19 or newer and git.</text></g>
</svg>
