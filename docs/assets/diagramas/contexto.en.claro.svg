<text x="32" y="44" font-size="22" font-weight="700" fill="#07080f">Context: where aidlc-harness fits</text>
<text x="32" y="68" font-size="13" fill="#4a4d57">People decide, the AI tool executes, the kit enforces what was agreed.</text>
