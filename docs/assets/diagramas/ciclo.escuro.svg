<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="O ciclo que o kit cobra, animado">
<rect width="1200" height="360" fill="#07080f"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#f2f4fa">O ciclo que o kit cobra</text>
<text x="32" y="68" font-size="13" fill="#b0b2b8">Um pedido só chega a pronto passando por cada portão; sem evidência, o gate devolve.</text>
<g><rect x="40" y="104" width="160" height="96" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="52" y="128" font-size="15" font-weight="700" fill="#f2f4fa">Pedido</text><text x="52" y="148" font-size="12" fill="#b0b2b8">uma frase do</text><text x="52" y="165" font-size="12" fill="#b0b2b8">que se quer</text></g>
<g><rect x="232" y="104" width="160" height="96" rx="9" fill="#0a1a36" stroke="#3d96ff" stroke-width="1.4"/><text x="244" y="128" font-size="15" font-weight="700" fill="#f2f4fa">Inception</text><text x="244" y="148" font-size="12" fill="#b0b2b8">rascunho completo,</text><text x="244" y="165" font-size="12" fill="#b0b2b8">até 5 perguntas</text></g>
<g><rect x="424" y="104" width="160" height="96" rx="9" fill="#171a3d" stroke="#8b96f0" stroke-width="1.4"/><text x="436" y="128" font-size="15" font-weight="700" fill="#f2f4fa">Aprovação</text><text x="436" y="148" font-size="12" fill="#b0b2b8">uma pessoa assina</text><text x="436" y="165" font-size="12" fill="#b0b2b8">o arquivo</text></g>
<g><rect x="616" y="104" width="160" height="96" rx="9" fill="#0a1a36" stroke="#3d96ff" stroke-width="1.4"/><text x="628" y="128" font-size="15" font-weight="700" fill="#f2f4fa">Construction</text><text x="628" y="148" font-size="12" fill="#b0b2b8">código e teste</text><text x="628" y="165" font-size="12" fill="#b0b2b8">no mesmo diff</text></g>
<g><rect x="808" y="104" width="160" height="96" rx="9" fill="#2a1d06" stroke="#f59e0b" stroke-width="1.4"/><text x="820" y="128" font-size="15" font-weight="700" fill="#f2f4fa">Gate</text><text x="820" y="148" font-size="12" fill="#b0b2b8">saída crua do</text><text x="820" y="165" font-size="12" fill="#b0b2b8">teste no chat</text></g>
<g><rect x="1000" y="104" width="160" height="96" rx="9" fill="#0b2214" stroke="#34c759" stroke-width="1.4"/><text x="1012" y="128" font-size="15" font-weight="700" fill="#f2f4fa">Pronto</text><text x="1012" y="148" font-size="12" fill="#b0b2b8">com evidência</text><text x="1012" y="165" font-size="12" fill="#b0b2b8">registrada</text></g>
<style>.cc-a{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.4,0,.2,1)}.cc-pk{transform:translateX(960px);fill:#34c759;animation-name:cc-anda,cc-cor}@keyframes cc-anda{0%{transform:translateX(0);opacity:0}3%{opacity:1}8%,14%{transform:translateX(192px)}20%,28%{transform:translateX(384px)}34%,42%{transform:translateX(576px)}48%{transform:translateX(742px)}50%{transform:translateX(752px)}55%,59%{transform:translateX(600px)}65%{transform:translateX(768px)}73%,94%{transform:translateX(960px);opacity:1}99%,100%{transform:translateX(960px);opacity:0}}@keyframes cc-cor{0%,46%{fill:#3d96ff}48%,56%{fill:#ff5a52}60%,64%{fill:#3d96ff}68%,100%{fill:#34c759}}.cc-r{opacity:0}.cc-r1{animation-name:cc-r1}.cc-r2{animation-name:cc-r2}.cc-r3{animation-name:cc-r3}.cc-g1{animation-name:cc-g1}.cc-g2{animation-name:cc-g2}.cc-p{opacity:1;animation-name:cc-p}.cc-x{opacity:0;animation-name:cc-x}@keyframes cc-r1{0%,6%{opacity:0}9%,14%{opacity:1}18%,100%{opacity:0}}@keyframes cc-r2{0%,18%{opacity:0}21%,28%{opacity:1}32%,100%{opacity:0}}@keyframes cc-r3{0%,32%{opacity:0}35%,42%{opacity:1}46%,100%{opacity:0}}@keyframes cc-g1{0%,47%{opacity:0}50%,56%{opacity:1}60%,100%{opacity:0}}@keyframes cc-g2{0%,63%{opacity:0}66%,72%{opacity:1}76%,100%{opacity:0}}@keyframes cc-p{0%,71%{opacity:0}75%,94%{opacity:1}99%,100%{opacity:0}}@keyframes cc-x{0%,48%{opacity:0}50%,59%{opacity:1}62%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){.cc-a{animation:none!important}}</style><line x1="120" y1="254" x2="1080" y2="254" stroke="#262938" stroke-width="2"/><circle cx="120" cy="254" r="5" fill="#07080f" stroke="#b0b2b8" stroke-width="1.6"/><circle cx="312" cy="254" r="5" fill="#07080f" stroke="#b0b2b8" stroke-width="1.6"/><circle cx="504" cy="254" r="5" fill="#07080f" stroke="#b0b2b8" stroke-width="1.6"/><circle cx="696" cy="254" r="5" fill="#07080f" stroke="#b0b2b8" stroke-width="1.6"/><circle cx="888" cy="254" r="5" fill="#07080f" stroke="#b0b2b8" stroke-width="1.6"/><circle cx="1080" cy="254" r="5" fill="#07080f" stroke="#b0b2b8" stroke-width="1.6"/><rect class="cc-a cc-r cc-r1" x="229" y="101" width="166" height="102" rx="11" fill="none" stroke="#3d96ff" stroke-width="3"/><rect class="cc-a cc-r cc-r2" x="421" y="101" width="166" height="102" rx="11" fill="none" stroke="#8b96f0" stroke-width="3"/><rect class="cc-a cc-r cc-r3" x="613" y="101" width="166" height="102" rx="11" fill="none" stroke="#3d96ff" stroke-width="3"/><rect class="cc-a cc-r cc-g1" x="805" y="101" width="166" height="102" rx="11" fill="none" stroke="#ff5a52" stroke-width="3"/><rect class="cc-a cc-r cc-g2" x="805" y="101" width="166" height="102" rx="11" fill="none" stroke="#34c759" stroke-width="3"/><rect class="cc-a cc-r cc-p" x="997" y="101" width="166" height="102" rx="11" fill="none" stroke="#34c759" stroke-width="3"/><text class="cc-a cc-x" x="888" y="288" font-size="13" font-weight="700" text-anchor="middle" fill="#ff5a52">sem evidência: volta para o agente</text><circle class="cc-a cc-pk" cx="120" cy="254" r="10"/><text x="32" y="336" font-size="13" fill="#b0b2b8">No Claude Code, Copilot, Cursor e Codex quem devolve é o hook; em todas, o CI barra o merge.</text>
</svg>
