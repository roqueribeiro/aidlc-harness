<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="AI-DLC phases and human approval">
<rect width="1200" height="680" fill="#ffffff"/>
<defs><marker id="ponta-roxo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#0f172a">The AI-DLC phases and where human approval sits</text>
<text x="32" y="68" font-size="13" fill="#475569">The kit's interpretation of the AWS AI-DLC. Artifacts live in the repository, not in a tool.</text>
<rect x="40" y="100" width="340" height="330" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="54" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">INCEPTION</text>
<text x="60" y="150" font-size="13" text-anchor="start" fill="#0f172a" font-weight="700">The AI asks, the team answers</text>
<g><rect x="60" y="170" width="300" height="70" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="72" y="194" font-size="15" font-weight="700" fill="#0f172a">aidlc/inception/</text><text x="72" y="214" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">requirements.md</text></g>
<g><rect x="60" y="250" width="300" height="70" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="72" y="274" font-size="15" font-weight="700" fill="#0f172a">aidlc/inception/</text><text x="72" y="294" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">units-of-work.md</text></g>
<g><rect x="60" y="330" width="300" height="84" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="72" y="354" font-size="15" font-weight="700" fill="#0f172a">/inception</text><text x="72" y="374" font-size="12" fill="#475569">drives the elaboration with the</text><text x="72" y="391" font-size="12" fill="#475569">team, never inventing an answer</text></g>
<rect x="430" y="100" width="340" height="330" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
<text x="444" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">CONSTRUCTION</text>
<text x="450" y="150" font-size="13" text-anchor="start" fill="#0f172a" font-weight="700">Short bolts, one unit at a time</text>
<g><rect x="450" y="170" width="300" height="70" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="462" y="194" font-size="15" font-weight="700" fill="#0f172a">aidlc/construction/</text><text x="462" y="214" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">design.md</text></g>
<g><rect x="450" y="250" width="300" height="70" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="462" y="274" font-size="15" font-weight="700" fill="#0f172a">Test, implementation, gate</text><text x="462" y="294" font-size="12" fill="#475569">aidlc-gate with raw evidence</text></g>
<g><rect x="450" y="330" width="300" height="84" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="462" y="354" font-size="15" font-weight="700" fill="#0f172a">/construction</text><text x="462" y="374" font-size="12" fill="#475569">one unit per bolt;</text><text x="462" y="391" font-size="12" fill="#475569">green gate before closing</text></g>
<rect x="820" y="100" width="340" height="330" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="834" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">OPERATIONS</text>
<text x="840" y="150" font-size="13" text-anchor="start" fill="#0f172a" font-weight="700">The thinnest part of the kit</text>
<g><rect x="840" y="170" width="300" height="70" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="852" y="194" font-size="15" font-weight="700" fill="#0f172a">Delivery and observation</text><text x="852" y="214" font-size="12" fill="#475569">is left to your process</text></g>
<g><rect x="840" y="250" width="300" height="70" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="852" y="274" font-size="15" font-weight="700" fill="#0f172a">aidlc-cycle</text><text x="852" y="294" font-size="12" fill="#475569">measures hours between phases</text></g>
<g><rect x="840" y="330" width="300" height="80" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="852" y="354" font-size="15" font-weight="700" fill="#0f172a">aidlc-limpeza</text><text x="852" y="374" font-size="12" fill="#475569">closes the unit with no leftovers</text></g>
<path d="M380 265 L430 265" fill="none" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#ponta-roxo)"/>
<path d="M770 265 L820 265" fill="none" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#ponta-roxo)"/>
<rect x="386" y="232" width="70" height="22" rx="11" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/><text x="395" y="247" font-size="11" fill="#0f172a">approves</text>
<rect x="776" y="232" width="70" height="22" rx="11" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/><text x="785" y="247" font-size="11" fill="#0f172a">approves</text>
<rect x="40" y="460" width="1120" height="190" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="54" y="482" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">AIDLC-PHASE: THE LOCK BETWEEN PHASES</text>
<g><rect x="60" y="495" width="340" height="135" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="72" y="519" font-size="15" font-weight="700" fill="#0f172a">aidlc-phase check &lt;phase&gt;</text><text x="72" y="539" font-size="12" fill="#475569">fails while any field is</text><text x="72" y="556" font-size="12" fill="#475569">unfilled or an approval is</text><text x="72" y="573" font-size="12" fill="#475569">blank in the artifact</text></g>
<g><rect x="420" y="495" width="340" height="135" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/><text x="432" y="519" font-size="15" font-weight="700" fill="#0f172a">A person signs in the file</text><text x="432" y="539" font-size="12" fill="#475569">Approved by: and Date: at the end</text><text x="432" y="556" font-size="12" fill="#475569">of the artifact; the check refuses</text><text x="432" y="573" font-size="12" fill="#475569">an AI name, so only a person approves</text></g>
<g><rect x="780" y="495" width="360" height="135" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="792" y="519" font-size="15" font-weight="700" fill="#0f172a">aidlc-phase status</text><text x="792" y="539" font-size="12" fill="#475569">shows which phase the project is in</text><text x="792" y="556" font-size="12" fill="#475569">and what blocks the next one</text><text x="792" y="573" font-size="12" fill="#475569">(read-only)</text></g>
</svg>
