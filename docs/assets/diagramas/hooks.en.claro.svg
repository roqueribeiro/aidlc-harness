<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Hook lifecycle">
<rect width="1200" height="700" fill="#ffffff"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#0f172a">Hook lifecycle</text>
<text x="32" y="68" font-size="13" fill="#475569">Five Claude Code events; each one has an owner, and almost everything runs in under 70 ms.</text>
<g><rect x="40" y="100" width="210" height="78" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="52" y="124" font-size="15" font-weight="700" fill="#0f172a">SessionStart</text><text x="52" y="144" font-size="12" fill="#475569">on open or resume</text></g>
<g><rect x="40" y="200" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="52" y="224" font-size="15" font-weight="700" fill="#0f172a">session-brief</text><text x="52" y="244" font-size="12" fill="#475569">announces stack, gates</text><text x="52" y="261" font-size="12" fill="#475569">and the current phase</text></g>
<path d="M250 139 L266 139" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="266" y="100" width="210" height="78" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="278" y="124" font-size="15" font-weight="700" fill="#0f172a">UserPromptSubmit</text><text x="278" y="144" font-size="12" fill="#475569">on every prompt</text></g>
<g><rect x="266" y="200" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="278" y="224" font-size="15" font-weight="700" fill="#0f172a">strategy-map</text><text x="278" y="244" font-size="12" fill="#475569">reinjects the rule map</text><text x="278" y="261" font-size="12" fill="#475569">survives /compact</text></g>
<path d="M476 139 L492 139" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="492" y="100" width="210" height="78" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="504" y="124" font-size="15" font-weight="700" fill="#0f172a">PreToolUse</text><text x="504" y="144" font-size="12" fill="#475569">before Bash/Write/Edit</text></g>
<g><rect x="492" y="200" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="504" y="224" font-size="15" font-weight="700" fill="#0f172a">scratch-guard</text><text x="504" y="244" font-size="12" fill="#475569">drafts only in the</text><text x="504" y="261" font-size="12" fill="#475569">scratch folder (opt-in)</text></g>
<g><rect x="492" y="300" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="504" y="324" font-size="15" font-weight="700" fill="#0f172a">pkg-manager</text><text x="504" y="344" font-size="12" fill="#475569">yarn or npm as set by</text><text x="504" y="361" font-size="12" fill="#475569">the repo manifest</text></g>
<g><rect x="492" y="400" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="504" y="424" font-size="15" font-weight="700" fill="#0f172a">secret-guard</text><text x="504" y="444" font-size="12" fill="#475569">blocks echo/cat of</text><text x="504" y="461" font-size="12" fill="#475569">secrets and env dumps</text></g>
<path d="M702 139 L718 139" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="718" y="100" width="210" height="78" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="730" y="124" font-size="15" font-weight="700" fill="#0f172a">PostToolUse</text><text x="730" y="144" font-size="12" fill="#475569">after Edit/Write</text></g>
<g><rect x="718" y="200" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="730" y="224" font-size="15" font-weight="700" fill="#0f172a">path-strategy</text><text x="730" y="244" font-size="12" fill="#475569">delivers the rule for</text><text x="730" y="261" font-size="12" fill="#475569">the file that changed</text></g>
<path d="M928 139 L944 139" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="944" y="100" width="210" height="78" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="956" y="124" font-size="15" font-weight="700" fill="#0f172a">Stop</text><text x="956" y="144" font-size="12" fill="#475569">when the agent stops</text></g>
<g><rect x="944" y="200" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="956" y="224" font-size="15" font-weight="700" fill="#0f172a">dod-check</text><text x="956" y="244" font-size="12" fill="#475569">requires the evidence from</text><text x="956" y="261" font-size="12" fill="#475569">the manifest in the chat</text></g>
<g><rect x="944" y="300" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="956" y="324" font-size="15" font-weight="700" fill="#0f172a">promise-check</text><text x="956" y="344" font-size="12" fill="#475569">blocks &quot;I will do it later&quot;</text><text x="956" y="361" font-size="12" fill="#475569">without having done it</text></g>
<rect x="40" y="520" width="1120" height="150" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="54" y="542" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">WHAT EACH HOOK PRODUCES</text>
<g><rect x="60" y="555" width="340" height="90" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="72" y="579" font-size="15" font-weight="700" fill="#0f172a">exit 2: blocks</text><text x="72" y="599" font-size="12" fill="#475569">PreToolUse stops the command</text><text x="72" y="616" font-size="12" fill="#475569">and says what to use instead</text></g>
<g><rect x="420" y="555" width="340" height="90" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="432" y="579" font-size="15" font-weight="700" fill="#0f172a">additional context</text><text x="432" y="599" font-size="12" fill="#475569">SessionStart, UserPromptSubmit</text><text x="432" y="616" font-size="12" fill="#475569">and PostToolUse deliver text</text></g>
<g><rect x="780" y="555" width="360" height="90" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="792" y="579" font-size="15" font-weight="700" fill="#0f172a">refuses the end of the turn</text><text x="792" y="599" font-size="12" fill="#475569">Stop asks for evidence; after 3</text><text x="792" y="616" font-size="12" fill="#475569">refusals it becomes a warning, then lets go</text></g>
</svg>
