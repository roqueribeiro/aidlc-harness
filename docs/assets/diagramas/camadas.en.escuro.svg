<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Manifest layers">
<rect width="1200" height="670" fill="#0b1220"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<defs><marker id="ponta-destaque" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker></defs>
<defs><marker id="ponta-ambar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs>
<defs><marker id="ponta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#e2e8f0">Manifest layers: where acceptance criteria come from</text>
<text x="32" y="68" font-size="13" fill="#94a3b8">A technology is a JSON file. The project's wins over the kit's; the organization layer applies to every stack.</text>
<g><rect x="40" y="110" width="330" height="100" rx="9" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.4"/><text x="52" y="134" font-size="15" font-weight="700" fill="#e2e8f0">Kit</text><text x="52" y="154" font-size="12" fill="#94a3b8">plugins/aidlc-harness/quality/</text><text x="52" y="171" font-size="12" fill="#94a3b8">node-yarn, node-npm, python-uv</text></g>
<g><rect x="40" y="240" width="330" height="100" rx="9" fill="#33250a" stroke="#fbbf24" stroke-width="1.4"/><text x="52" y="264" font-size="15" font-weight="700" fill="#e2e8f0">Organization layer</text><text x="52" y="284" font-size="12" fill="#94a3b8">quality/_org.json</text><text x="52" y="301" font-size="12" fill="#94a3b8">lockfile gate, cleanup evidence</text></g>
<g><rect x="40" y="370" width="330" height="100" rx="9" fill="#13284d" stroke="#60a5fa" stroke-width="1.4"/><text x="52" y="394" font-size="15" font-weight="700" fill="#e2e8f0">Project</text><text x="52" y="414" font-size="12" fill="#94a3b8">.aidlc/quality/&lt;tech&gt;.json</text><text x="52" y="431" font-size="12" fill="#94a3b8">the same tech overrides the kit's</text></g>
<g><rect x="450" y="200" width="300" height="150" rx="9" fill="#241a45" stroke="#a78bfa" stroke-width="1.4"/><text x="462" y="224" font-size="15" font-weight="700" fill="#e2e8f0">Effective manifest</text><text x="462" y="244" font-size="12" fill="#94a3b8">gates: what runs</text><text x="462" y="261" font-size="12" fill="#94a3b8">evidence: what to paste in chat</text><text x="462" y="278" font-size="12" fill="#94a3b8">strategy: which rule, which reviewer</text><text x="462" y="295" font-size="12" fill="#94a3b8">pkgManager, autonomy, security</text></g>
<path d="M370 160 L410 160 L410 275 L450 275" fill="none" stroke="#4ade80" stroke-width="1.6" marker-end="url(#ponta-verde)"/>
<path d="M370 290 L450 290" fill="none" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#ponta-ambar)"/>
<rect x="379" y="281" width="62" height="18" rx="4" fill="#0b1220" opacity="0.92"/><text x="410" y="294" font-size="11" text-anchor="middle" fill="#94a3b8">inherits</text>
<path d="M370 420 L410 420 L410 310 L450 310" fill="none" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ponta-destaque)"/>
<rect x="376" y="356" width="68" height="18" rx="4" fill="#0b1220" opacity="0.92"/><text x="410" y="369" font-size="11" text-anchor="middle" fill="#94a3b8">overrides</text>
<g><rect x="450" y="400" width="300" height="90" rx="9" fill="#111a2e" stroke="#334155" stroke-width="1.4"/><text x="462" y="424" font-size="15" font-weight="700" fill="#e2e8f0">Detection</text><text x="462" y="444" font-size="12" fill="#94a3b8">allFiles, anyFiles, packageDeps</text><text x="462" y="461" font-size="12" fill="#94a3b8">looks at content, not the name</text></g>
<path d="M600 400 L600 350" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<rect x="550" y="366" width="100" height="18" rx="4" fill="#0b1220" opacity="0.92"/><text x="600" y="379" font-size="11" text-anchor="middle" fill="#94a3b8">picks the tech</text>
<g><rect x="850" y="110" width="310" height="80" rx="9" fill="#111a2e" stroke="#334155" stroke-width="1.4"/><text x="862" y="134" font-size="15" font-weight="700" fill="#e2e8f0">aidlc-gate</text><text x="862" y="154" font-size="12" fill="#94a3b8">runs the gates and prints the state</text></g>
<g><rect x="850" y="210" width="310" height="80" rx="9" fill="#111a2e" stroke="#334155" stroke-width="1.4"/><text x="862" y="234" font-size="15" font-weight="700" fill="#e2e8f0">session-brief</text><text x="862" y="254" font-size="12" fill="#94a3b8">announces what applies in this repo</text></g>
<g><rect x="850" y="310" width="310" height="80" rx="9" fill="#111a2e" stroke="#334155" stroke-width="1.4"/><text x="862" y="334" font-size="15" font-weight="700" fill="#e2e8f0">dod-check</text><text x="862" y="354" font-size="12" fill="#94a3b8">demands evidence at Stop</text></g>
<g><rect x="850" y="410" width="310" height="80" rx="9" fill="#111a2e" stroke="#334155" stroke-width="1.4"/><text x="862" y="434" font-size="15" font-weight="700" fill="#e2e8f0">path-strategy</text><text x="862" y="454" font-size="12" fill="#94a3b8">delivers the rule for the file</text></g>
<path d="M750 275 L800 275 L800 150 L850 150" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M750 275 L800 275 L800 250 L850 250" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M750 275 L800 275 L800 350 L850 350" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M750 275 L800 275 L800 450 L850 450" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="40" y="530" width="1120" height="110" rx="9" fill="#111a2e" stroke="#334155" stroke-width="1.4"/><text x="52" y="554" font-size="15" font-weight="700" fill="#e2e8f0">Rules that check-quality-manifests enforces</text><text x="52" y="574" font-size="12" fill="#94a3b8">invalid is ignored and reported, never silent; a literal copy of an inherited gate fails</text><text x="52" y="591" font-size="12" fill="#94a3b8">a gate has exactly one of cmd and agent; an @kit/ pointer to a missing file fails</text><text x="52" y="608" font-size="12" fill="#94a3b8">inherits: false refuses inheritance; status archived takes the technology out of circulation</text></g>
</svg>
