<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Installation">
<rect width="1200" height="600" fill="#ffffff"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#0f172a">Installation, from clone to first gate</text>
<text x="32" y="68" font-size="13" fill="#475569">One machine, once; then one command per project.</text>
<g><rect x="40" y="130" width="210" height="110" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="52" y="154" font-size="15" font-weight="700" fill="#0f172a">Get the kit</text><text x="52" y="174" font-size="12" fill="#475569">git clone of the repository</text><text x="52" y="191" font-size="12" fill="#475569">or the aidlc marketplace</text></g>
<circle cx="52" cy="118" r="11" fill="#2563eb"/><text x="52" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<path d="M250 185 L266 185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="266" y="130" width="210" height="110" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="278" y="154" font-size="15" font-weight="700" fill="#0f172a">scripts/setup.mjs</text><text x="278" y="174" font-size="12" fill="#475569">puts aidlc-* on the PATH</text><text x="278" y="191" font-size="12" fill="#475569">--check and --uninstall</text></g>
<circle cx="278" cy="118" r="11" fill="#2563eb"/><text x="278" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<path d="M476 185 L492 185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="492" y="130" width="210" height="110" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="504" y="154" font-size="15" font-weight="700" fill="#0f172a">Plugin in Claude Code</text><text x="504" y="174" font-size="12" fill="#475569">marketplace add and</text><text x="504" y="191" font-size="12" fill="#475569">plugin install</text></g>
<circle cx="504" cy="118" r="11" fill="#2563eb"/><text x="504" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<path d="M702 185 L718 185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="718" y="130" width="210" height="110" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="730" y="154" font-size="15" font-weight="700" fill="#0f172a">aidlc-init</text><text x="730" y="174" font-size="12" fill="#475569">project skeleton and</text><text x="730" y="191" font-size="12" fill="#475569">instructions for the 3 AIs</text></g>
<circle cx="730" cy="118" r="11" fill="#2563eb"/><text x="730" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<path d="M928 185 L944 185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="944" y="130" width="210" height="110" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="956" y="154" font-size="15" font-weight="700" fill="#0f172a">doctor and gate</text><text x="956" y="174" font-size="12" fill="#475569">repository score and the</text><text x="956" y="191" font-size="12" fill="#475569">acceptance criteria running</text></g>
<circle cx="956" cy="118" r="11" fill="#2563eb"/><text x="956" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<g><rect x="40" y="300" width="540" height="130" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="52" y="324" font-size="15" font-weight="700" fill="#0f172a">Optional, per clone</text><text x="52" y="344" font-size="12" fill="#475569">node scripts/install-git-hooks.mjs</text><text x="52" y="361" font-size="12" fill="#475569">installs the pre-push that runs aidlc-gate</text><text x="52" y="378" font-size="12" fill="#475569">and never overwrites someone else's hook</text></g>
<g><rect x="620" y="300" width="540" height="130" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="632" y="324" font-size="15" font-weight="700" fill="#0f172a">To publish your fork</text><text x="632" y="344" font-size="12" fill="#475569">node scripts/definir-dono.mjs --owner &lt;org&gt;</text><text x="632" y="361" font-size="12" fill="#475569">replaces the owner and contact</text><text x="632" y="378" font-size="12" fill="#475569">placeholders; --check lists what is missing</text></g>
<g><rect x="40" y="470" width="1120" height="100" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="52" y="494" font-size="15" font-weight="700" fill="#0f172a">No runtime dependencies</text><text x="52" y="514" font-size="12" fill="#475569">The kit is plain Node: there is no npm install or yarn install for the kit itself. Requires Node 20.19 or newer and git.</text></g>
</svg>
