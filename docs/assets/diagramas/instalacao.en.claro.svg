<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Installation">
<rect width="1200" height="600" fill="#ffffff"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#0f172a">Installation, from zero to the first gate</text>
<text x="32" y="68" font-size="13" fill="#475569">One command per project. Nothing to install on the machine.</text>
<g><rect x="40" y="130" width="210" height="110" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="52" y="154" font-size="15" font-weight="700" fill="#0f172a">npx ... init</text><text x="52" y="174" font-size="12" fill="#475569">one command, in the</text><text x="52" y="191" font-size="12" fill="#475569">project folder</text></g>
<circle cx="52" cy="118" r="11" fill="#2563eb"/><text x="52" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<path d="M250 185 L266 185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="266" y="130" width="210" height="110" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="278" y="154" font-size="15" font-weight="700" fill="#0f172a">Kit copy</text><text x="278" y="174" font-size="12" fill="#475569">.aidlc/kit/ goes in git;</text><text x="278" y="191" font-size="12" fill="#475569">hooks and gate run from it</text></g>
<circle cx="278" cy="118" r="11" fill="#2563eb"/><text x="278" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<path d="M476 185 L492 185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="492" y="130" width="210" height="110" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="504" y="154" font-size="15" font-weight="700" fill="#0f172a">Open the tool</text><text x="504" y="174" font-size="12" fill="#475569">Claude Code: accept the</text><text x="504" y="191" font-size="12" fill="#475569">trust and the plugin loads</text></g>
<circle cx="504" cy="118" r="11" fill="#2563eb"/><text x="504" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<path d="M702 185 L718 185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="718" y="130" width="210" height="110" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="730" y="154" font-size="15" font-weight="700" fill="#0f172a">Inception</text><text x="730" y="174" font-size="12" fill="#475569">the tool's command,</text><text x="730" y="191" font-size="12" fill="#475569">plus a one-line request</text></g>
<circle cx="730" cy="118" r="11" fill="#2563eb"/><text x="730" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<path d="M928 185 L944 185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="944" y="130" width="210" height="110" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="956" y="154" font-size="15" font-weight="700" fill="#0f172a">First gate</text><text x="956" y="174" font-size="12" fill="#475569">Trivy is downloaded and</text><text x="956" y="191" font-size="12" fill="#475569">checked by sha256</text></g>
<circle cx="956" cy="118" r="11" fill="#2563eb"/><text x="956" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<g><rect x="40" y="300" width="540" height="130" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="52" y="324" font-size="15" font-weight="700" fill="#0f172a">The teammate who only clones</text><text x="52" y="344" font-size="12" fill="#475569">everything works with no install: the kit</text><text x="52" y="361" font-size="12" fill="#475569">copy comes in git, and CI fails an edited copy</text><text x="52" y="378" font-size="12" fill="#475569">with the kit pinned to the version</text></g>
<g><rect x="620" y="300" width="540" height="130" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="632" y="324" font-size="15" font-weight="700" fill="#0f172a">Linux, macOS and Windows</text><text x="632" y="344" font-size="12" fill="#475569">CI runs this first run with no</text><text x="632" y="361" font-size="12" fill="#475569">aidlc on the PATH and an empty home,</text><text x="632" y="378" font-size="12" fill="#475569">on all three, on every push</text></g>
<g><rect x="40" y="470" width="1120" height="100" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="52" y="494" font-size="15" font-weight="700" fill="#0f172a">No runtime dependencies</text><text x="52" y="514" font-size="12" fill="#475569">The kit is plain Node: it installs no third-party package. Requires Node 20.19 or newer and git.</text></g>
</svg>
