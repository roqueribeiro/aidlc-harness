<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Camadas de manifesto">
<rect width="1200" height="670" fill="#ffffff"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4d57"/></marker></defs>
<defs><marker id="ponta-destaque" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0066cc"/></marker></defs>
<defs><marker id="ponta-ambar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a5b00"/></marker></defs>
<defs><marker id="ponta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#07080f">Camadas de manifesto: de onde vem o critério de aceite</text>
<text x="32" y="68" font-size="13" fill="#4a4d57">Uma tecnologia é um arquivo JSON. O do projeto vence o do kit; a camada da organização vale para toda stack.</text>
<g><rect x="40" y="110" width="330" height="100" rx="9" fill="#e3f6e8" stroke="#1a7f37" stroke-width="1.4"/><text x="52" y="134" font-size="15" font-weight="700" fill="#07080f">Kit</text><text x="52" y="154" font-size="12" fill="#4a4d57">plugins/aidlc-harness/quality/</text><text x="52" y="171" font-size="12" fill="#4a4d57">node-yarn, node-npm, python-uv</text></g>
<g><rect x="40" y="240" width="330" height="100" rx="9" fill="#fdf0d8" stroke="#9a5b00" stroke-width="1.4"/><text x="52" y="264" font-size="15" font-weight="700" fill="#07080f">Camada da organização</text><text x="52" y="284" font-size="12" fill="#4a4d57">quality/_org.json</text><text x="52" y="301" font-size="12" fill="#4a4d57">gate lockfile, evidência de limpeza</text></g>
<g><rect x="40" y="370" width="330" height="100" rx="9" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.4"/><text x="52" y="394" font-size="15" font-weight="700" fill="#07080f">Projeto</text><text x="52" y="414" font-size="12" fill="#4a4d57">.aidlc/quality/&lt;tech&gt;.json</text><text x="52" y="431" font-size="12" fill="#4a4d57">o mesmo tech sobrescreve o do kit</text></g>
<g><rect x="450" y="200" width="300" height="150" rx="9" fill="#ebedfd" stroke="#4c51bf" stroke-width="1.4"/><text x="462" y="224" font-size="15" font-weight="700" fill="#07080f">Manifesto efetivo</text><text x="462" y="244" font-size="12" fill="#4a4d57">gates: o que roda</text><text x="462" y="261" font-size="12" fill="#4a4d57">evidence: o que colar no chat</text><text x="462" y="278" font-size="12" fill="#4a4d57">strategy: qual regra, qual revisor</text><text x="462" y="295" font-size="12" fill="#4a4d57">pkgManager, autonomy, security</text></g>
<path d="M370 160 L410 160 L410 275 L450 275" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#ponta-verde)"/>
<path d="M370 290 L450 290" fill="none" stroke="#9a5b00" stroke-width="1.6" marker-end="url(#ponta-ambar)"/>
<rect x="389" y="281" width="42" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="410" y="294" font-size="11" text-anchor="middle" fill="#4a4d57">herda</text>
<path d="M370 420 L410 420 L410 310 L450 310" fill="none" stroke="#0066cc" stroke-width="1.6" marker-end="url(#ponta-destaque)"/>
<rect x="369.5" y="356" width="81" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="410" y="369" font-size="11" text-anchor="middle" fill="#4a4d57">sobrescreve</text>
<g><rect x="450" y="400" width="300" height="90" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="462" y="424" font-size="15" font-weight="700" fill="#07080f">Detecção</text><text x="462" y="444" font-size="12" fill="#4a4d57">allFiles, anyFiles, packageDeps</text><text x="462" y="461" font-size="12" fill="#4a4d57">olha o conteúdo, não o nome</text></g>
<path d="M600 400 L600 350" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<rect x="550" y="366" width="100" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="600" y="379" font-size="11" text-anchor="middle" fill="#4a4d57">escolhe o tech</text>
<g><rect x="850" y="110" width="310" height="80" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="862" y="134" font-size="15" font-weight="700" fill="#07080f">aidlc-gate</text><text x="862" y="154" font-size="12" fill="#4a4d57">roda os gates e imprime o estado</text></g>
<g><rect x="850" y="210" width="310" height="80" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="862" y="234" font-size="15" font-weight="700" fill="#07080f">session-brief</text><text x="862" y="254" font-size="12" fill="#4a4d57">anuncia o que vale neste repo</text></g>
<g><rect x="850" y="310" width="310" height="80" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="862" y="334" font-size="15" font-weight="700" fill="#07080f">dod-check</text><text x="862" y="354" font-size="12" fill="#4a4d57">cobra a evidência no Stop</text></g>
<g><rect x="850" y="410" width="310" height="80" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="862" y="434" font-size="15" font-weight="700" fill="#07080f">path-strategy</text><text x="862" y="454" font-size="12" fill="#4a4d57">entrega a regra do arquivo</text></g>
<path d="M750 275 L800 275 L800 150 L850 150" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M750 275 L800 275 L800 250 L850 250" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M750 275 L800 275 L800 350 L850 350" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M750 275 L800 275 L800 450 L850 450" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="40" y="530" width="1120" height="110" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="52" y="554" font-size="15" font-weight="700" fill="#07080f">Regras que o check-quality-manifests faz valer</text><text x="52" y="574" font-size="12" fill="#4a4d57">inválido é ignorado e reportado, nunca silencioso; cópia literal de gate herdado reprova</text><text x="52" y="591" font-size="12" fill="#4a4d57">gate tem exatamente um entre cmd e agent; ponteiro @kit/ para arquivo inexistente reprova</text><text x="52" y="608" font-size="12" fill="#4a4d57">inherits: false recusa a herança; status archived tira a tecnologia de circulação</text></g>
</svg>
