<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Como o Stop decide">
<rect width="1200" height="650" fill="#07080f"/>
<defs><marker id="ponta-ambar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker></defs>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0b2b8"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#f2f4fa">Como o Stop decide: pronto exige evidência</text>
<text x="32" y="68" font-size="13" fill="#b0b2b8">dod-check lê a árvore, o manifesto e o transcript. Nunca prende: tem saída em todo caminho.</text>
<g><rect x="40" y="120" width="220" height="80" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="52" y="144" font-size="15" font-weight="700" fill="#f2f4fa">Agente quer parar</text><text x="52" y="164" font-size="12" fill="#b0b2b8">fim do turno</text></g>
<g><rect x="310" y="120" width="240" height="80" rx="9" fill="#0a1a36" stroke="#3d96ff" stroke-width="1.4"/><text x="322" y="144" font-size="15" font-weight="700" fill="#f2f4fa">Árvore mudou?</text><text x="322" y="164" font-size="12" fill="#b0b2b8">git status do projeto</text></g>
<g><rect x="600" y="120" width="240" height="80" rx="9" fill="#0a1a36" stroke="#3d96ff" stroke-width="1.4"/><text x="612" y="144" font-size="15" font-weight="700" fill="#f2f4fa">Tecnologia conhecida?</text><text x="612" y="164" font-size="12" fill="#b0b2b8">detecção pelo conteúdo</text></g>
<g><rect x="890" y="120" width="270" height="80" rx="9" fill="#0a1a36" stroke="#3d96ff" stroke-width="1.4"/><text x="902" y="144" font-size="15" font-weight="700" fill="#f2f4fa">Evidência no chat?</text><text x="902" y="164" font-size="12" fill="#b0b2b8">markers do manifesto</text></g>
<path d="M260 160 L310 160" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M550 160 L600 160" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<rect x="560" y="151" width="30" height="18" rx="4" fill="#07080f" opacity="0.92"/><text x="575" y="164" font-size="11" text-anchor="middle" fill="#b0b2b8">sim</text>
<path d="M840 160 L890 160" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<rect x="850" y="151" width="30" height="18" rx="4" fill="#07080f" opacity="0.92"/><text x="865" y="164" font-size="11" text-anchor="middle" fill="#b0b2b8">sim</text>
<g><rect x="310" y="260" width="240" height="74" rx="9" fill="#0b2214" stroke="#34c759" stroke-width="1.4"/><text x="322" y="284" font-size="15" font-weight="700" fill="#f2f4fa">Libera</text><text x="322" y="304" font-size="12" fill="#b0b2b8">não houve entrega a provar</text></g>
<g><rect x="600" y="260" width="240" height="74" rx="9" fill="#0b2214" stroke="#34c759" stroke-width="1.4"/><text x="612" y="284" font-size="15" font-weight="700" fill="#f2f4fa">Libera</text><text x="612" y="304" font-size="12" fill="#b0b2b8">sem critério, sem cobrança</text></g>
<g><rect x="890" y="260" width="270" height="74" rx="9" fill="#0b2214" stroke="#34c759" stroke-width="1.4"/><text x="902" y="284" font-size="15" font-weight="700" fill="#f2f4fa">Libera</text><text x="902" y="304" font-size="12" fill="#b0b2b8">o gate foi colado</text></g>
<path d="M430 200 L430 260" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<rect x="415" y="221" width="30" height="18" rx="4" fill="#07080f" opacity="0.92"/><text x="430" y="234" font-size="11" text-anchor="middle" fill="#b0b2b8">não</text>
<path d="M720 200 L720 260" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<rect x="705" y="221" width="30" height="18" rx="4" fill="#07080f" opacity="0.92"/><text x="720" y="234" font-size="11" text-anchor="middle" fill="#b0b2b8">não</text>
<path d="M1025 200 L1025 260" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<rect x="1010" y="221" width="30" height="18" rx="4" fill="#07080f" opacity="0.92"/><text x="1025" y="234" font-size="11" text-anchor="middle" fill="#b0b2b8">sim</text>
<g><rect x="890" y="380" width="270" height="100" rx="9" fill="#2a1d06" stroke="#f59e0b" stroke-width="1.4"/><text x="902" y="404" font-size="15" font-weight="700" fill="#f2f4fa">Recusa o fim do turno</text><text x="902" y="424" font-size="12" fill="#b0b2b8">lista o que falta: saída do</text><text x="902" y="441" font-size="12" fill="#b0b2b8">gate, print, veredito do revisor</text></g>
<path d="M1160 160 L1180 160 L1180 430 L1160 430" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ponta-ambar)"/>
<rect x="1165" y="286" width="30" height="18" rx="4" fill="#07080f" opacity="0.92"/><text x="1180" y="299" font-size="11" text-anchor="middle" fill="#b0b2b8">não</text>
<g><rect x="40" y="380" width="800" height="100" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="52" y="404" font-size="15" font-weight="700" fill="#f2f4fa">Salvaguardas para nunca virar prisão</text><text x="52" y="424" font-size="12" fill="#b0b2b8">3 recusas na mesma sessão: vira aviso e libera</text><text x="52" y="441" font-size="12" fill="#b0b2b8">AIDLC_GATE=0 desliga; gate_mode aceita block, warn e off</text><text x="52" y="458" font-size="12" fill="#b0b2b8">falha ao gravar o registro de auditoria nunca segura o Stop</text></g>
<g><rect x="40" y="530" width="1120" height="90" rx="9" fill="#171a3d" stroke="#8b96f0" stroke-width="1.4"/><text x="52" y="554" font-size="15" font-weight="700" fill="#f2f4fa">Por que isso importa</text><text x="52" y="574" font-size="12" fill="#b0b2b8">Um gate que prende é desligado na primeira semana. O desenho aposta em cobrar pouco, sempre, e deixar saída.</text></g>
</svg>
