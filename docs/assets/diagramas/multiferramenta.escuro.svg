<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Uma fonte, 15 ferramentas de IA">
<rect width="1200" height="570" fill="#07080f"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0b2b8"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#f2f4fa">Uma fonte, 15 ferramentas de IA</text>
<text x="32" y="68" font-size="13" fill="#b0b2b8">O método mora em um lugar; o aidlc-init gera a camada de cada ferramenta, e o CI reprova divergência.</text>
<g><rect x="40" y="160" width="300" height="120" rx="9" fill="#0a1a36" stroke="#3d96ff" stroke-width="1.4"/><text x="52" y="184" font-size="15" font-weight="700" fill="#f2f4fa">A fonte</text><text x="52" y="204" font-size="12" fill="#b0b2b8">AGENTS.md: as regras</text><text x="52" y="221" font-size="12" fill="#b0b2b8">.agents/skills: o método de</text><text x="52" y="238" font-size="12" fill="#b0b2b8">cada fase (Inception, Construction)</text></g>
<g><rect x="400" y="165" width="260" height="110" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="412" y="189" font-size="15" font-weight="700" fill="#f2f4fa">aidlc-init</text><text x="412" y="209" font-size="12" fill="#b0b2b8">gera comando, skill e hook</text><text x="412" y="226" font-size="12" fill="#b0b2b8">no formato de cada ferramenta;</text><text x="412" y="243" font-size="12" fill="#b0b2b8">--check e --sync</text></g>
<path d="M340 220 L400 220" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="740" y="100" width="420" height="90" rx="9" fill="#0b2214" stroke="#34c759" stroke-width="1.4"/><text x="752" y="124" font-size="15" font-weight="700" fill="#f2f4fa">Janela de perguntas e hooks</text><text x="752" y="144" font-size="12" fill="#b0b2b8">Claude Code (plugin);</text><text x="752" y="161" font-size="12" fill="#b0b2b8">GitHub Copilot, Cursor e Codex (aidlc-hook)</text></g>
<g><rect x="740" y="215" width="420" height="90" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="752" y="239" font-size="15" font-weight="700" fill="#f2f4fa">Janela de perguntas; o CI cobra</text><text x="752" y="259" font-size="12" fill="#b0b2b8">OpenCode, Kilo Code, Gemini CLI, Antigravity,</text><text x="752" y="276" font-size="12" fill="#b0b2b8">Devin, Junie, Cline, Continue</text></g>
<g><rect x="740" y="330" width="420" height="90" rx="9" fill="#2a1d06" stroke="#f59e0b" stroke-width="1.4"/><text x="752" y="354" font-size="15" font-weight="700" fill="#f2f4fa">Pergunta em texto; o CI cobra</text><text x="752" y="374" font-size="12" fill="#b0b2b8">Kiro, Augment e Zed: opções em letras,</text><text x="752" y="391" font-size="12" fill="#b0b2b8">a recomendada marcada, ok aceita todas</text></g>
<path d="M660 220 L700 220 L700 145 L740 145" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M700 220 L700 260 L740 260" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M700 260 L700 375 L740 375" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="40" y="450" width="1120" height="80" rx="9" fill="#2a1d06" stroke="#f59e0b" stroke-width="1.4"/><text x="52" y="474" font-size="15" font-weight="700" fill="#f2f4fa">No CI, em todas (aidlc-gate.yml)</text><text x="52" y="494" font-size="12" fill="#b0b2b8">roda aidlc-identity, aidlc-init --check, aidlc-phase e aidlc-gate a cada push: é isso que cobra onde a ferramenta não tem hook</text></g>
</svg>
