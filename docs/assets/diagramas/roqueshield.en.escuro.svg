<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="RoqueShield and the kit: the scan loop">
<rect width="1200" height="650" fill="#0b1220"/>
<defs><marker id="ponta-roxo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker></defs>
<defs><marker id="ponta-destaque" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker></defs>
<defs><marker id="ponta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#e2e8f0">RoqueShield and the kit: the scan loop</text>
<text x="32" y="68" font-size="13" fill="#94a3b8">The platform finds, the kit enforces the result, the agent fixes. Any other platform plugs into the same spot.</text>
<rect x="40" y="100" width="330" height="320" rx="12" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.2"/>
<text x="54" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#94a3b8">ROQUESHIELD (PLATFORM)</text>
<g><rect x="60" y="135" width="290" height="85" rx="9" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.4"/><text x="72" y="159" font-size="15" font-weight="700" fill="#e2e8f0">1. Scan</text><text x="72" y="179" font-size="12" fill="#94a3b8">Semgrep, Trivy, ZAP, Nuclei...</text><text x="72" y="196" font-size="12" fill="#94a3b8">15 adapters, one contract</text></g>
<g><rect x="60" y="235" width="290" height="85" rx="9" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.4"/><text x="72" y="259" font-size="15" font-weight="700" fill="#e2e8f0">2. Triage</text><text x="72" y="279" font-size="12" fill="#94a3b8">the AI reclassifies and dedupes</text><text x="72" y="296" font-size="12" fill="#94a3b8">by deduped_key</text></g>
<g><rect x="60" y="335" width="290" height="65" rx="9" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.4"/><text x="72" y="359" font-size="15" font-weight="700" fill="#e2e8f0">3. AI Fix Bundle</text><text x="72" y="379" font-size="12" fill="#94a3b8">JSON, schema 1.0.0</text></g>
<rect x="430" y="100" width="340" height="320" rx="12" fill="#13284d" stroke="#60a5fa" stroke-width="1.2"/>
<text x="444" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#94a3b8">AIDLC-HARNESS (THE KIT)</text>
<g><rect x="450" y="135" width="300" height="100" rx="9" fill="#13284d" stroke="#60a5fa" stroke-width="1.4"/><text x="462" y="159" font-size="15" font-weight="700" fill="#e2e8f0">aidlc-scan</text><text x="462" y="179" font-size="12" fill="#94a3b8">reads the bundle (roqueshield)</text><text x="462" y="196" font-size="12" fill="#94a3b8">is coverage complete?</text><text x="462" y="213" font-size="12" fill="#94a3b8">did the required scanner run?</text></g>
<g><rect x="450" y="250" width="300" height="85" rx="9" fill="#13284d" stroke="#60a5fa" stroke-width="1.4"/><text x="462" y="274" font-size="15" font-weight="700" fill="#e2e8f0">Gate in the manifest</text><text x="462" y="294" font-size="12" fill="#94a3b8">aidlc-gate calls aidlc-scan</text><text x="462" y="311" font-size="12" fill="#94a3b8">the Stop hook demands the output</text></g>
<g><rect x="450" y="350" width="300" height="50" rx="9" fill="#13284d" stroke="#60a5fa" stroke-width="1.4"/><text x="462" y="374" font-size="13" font-weight="700" fill="#e2e8f0">0 clean · 1 failed · 2 did not run</text></g>
<rect x="830" y="100" width="330" height="320" rx="12" fill="#241a45" stroke="#a78bfa" stroke-width="1.2"/>
<text x="844" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#94a3b8">AI AGENT</text>
<g><rect x="850" y="135" width="290" height="100" rx="9" fill="#241a45" stroke="#a78bfa" stroke-width="1.4"/><text x="862" y="159" font-size="15" font-weight="700" fill="#e2e8f0">4. Fixes</text><text x="862" y="179" font-size="12" fill="#94a3b8">reads the bundle by patch_priority</text><text x="862" y="196" font-size="12" fill="#94a3b8">edits the code</text><text x="862" y="213" font-size="12" fill="#94a3b8">Claude Code, Kiro or Copilot</text></g>
<g><rect x="850" y="250" width="290" height="85" rx="9" fill="#241a45" stroke="#a78bfa" stroke-width="1.4"/><text x="862" y="274" font-size="15" font-weight="700" fill="#e2e8f0">5. Scans again</text><text x="862" y="294" font-size="12" fill="#94a3b8">same target, new report</text><text x="862" y="311" font-size="12" fill="#94a3b8">aidlc-scan --baseline before</text></g>
<g><rect x="850" y="350" width="290" height="50" rx="9" fill="#241a45" stroke="#a78bfa" stroke-width="1.4"/><text x="862" y="374" font-size="13" font-weight="700" fill="#e2e8f0">Stops when the scan is clean</text></g>
<path d="M350 185 L450 185" fill="none" stroke="#4ade80" stroke-width="1.6" marker-end="url(#ponta-verde)"/>
<rect x="375.5" y="176" width="49" height="18" rx="4" fill="#0b1220" opacity="0.92"/><text x="400" y="189" font-size="11" text-anchor="middle" fill="#94a3b8">bundle</text>
<path d="M770 185 L850 185" fill="none" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ponta-destaque)"/>
<rect x="782.5" y="176" width="55" height="18" rx="4" fill="#0b1220" opacity="0.92"/><text x="810" y="189" font-size="11" text-anchor="middle" fill="#94a3b8">decides</text>
<path d="M995 420 L995 455 L240 455 L240 420" fill="none" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#ponta-roxo)"/>
<rect x="421" y="446" width="393" height="18" rx="4" fill="#0b1220" opacity="0.92"/><text x="617.5" y="459" font-size="11" text-anchor="middle" fill="#94a3b8">repeats until the scan is clean with coverage still complete</text>
<g><rect x="40" y="495" width="540" height="120" rx="9" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.4"/><text x="52" y="519" font-size="15" font-weight="700" fill="#e2e8f0">Any other platform plugs in the same way</text><text x="52" y="539" font-size="12" fill="#94a3b8">SARIF 2.1.0: Semgrep, CodeQL, Trivy and others</text><text x="52" y="556" font-size="12" fill="#94a3b8">Neutral format: a short conversion</text><text x="52" y="573" font-size="12" fill="#94a3b8">Only --format and the scanner name change</text></g>
<g><rect x="620" y="495" width="540" height="120" rx="9" fill="#33250a" stroke="#fbbf24" stroke-width="1.4"/><text x="632" y="519" font-size="15" font-weight="700" fill="#e2e8f0">What the kit does not assume</text><text x="632" y="539" font-size="12" fill="#94a3b8">That the platform is up: with no report,</text><text x="632" y="556" font-size="12" fill="#94a3b8">the exit is 2 (did not run), never clean.</text><text x="632" y="573" font-size="12" fill="#94a3b8">Integration validated against its documentation.</text></g>
</svg>
