<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Contrato de varredura">
<rect width="1200" height="680" fill="#ffffff"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4d57"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#07080f">Contrato de varredura: qualquer plataforma de segurança</text>
<text x="32" y="68" font-size="13" fill="#4a4d57">O kit não embute um scanner. Ele cobra o resultado de um, e separa &quot;limpo&quot; de &quot;não rodou&quot;.</text>
<rect x="40" y="100" width="300" height="360" rx="12" fill="#f1f2f7" stroke="#d9dce6" stroke-width="1.2"/>
<text x="54" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#4a4d57">PLATAFORMAS (RELATÓRIO JSON)</text>
<g><rect x="55" y="135" width="270" height="90" rx="9" fill="#e3f6e8" stroke="#1a7f37" stroke-width="1.4"/><text x="67" y="159" font-size="15" font-weight="700" fill="#07080f">RoqueShield</text><text x="67" y="179" font-size="12" fill="#4a4d57">AI Fix Bundle</text><text x="67" y="196" font-size="12" fill="#4a4d57">scan.scanners_executed/failed</text></g>
<g><rect x="55" y="245" width="270" height="90" rx="9" fill="#e3f6e8" stroke="#1a7f37" stroke-width="1.4"/><text x="67" y="269" font-size="15" font-weight="700" fill="#07080f">Qualquer SARIF 2.1.0</text><text x="67" y="289" font-size="12" fill="#4a4d57">Semgrep, CodeQL, Snyk,</text><text x="67" y="306" font-size="12" fill="#4a4d57">Sonar, Trivy</text></g>
<g><rect x="55" y="355" width="270" height="90" rx="9" fill="#e3f6e8" stroke="#1a7f37" stroke-width="1.4"/><text x="67" y="379" font-size="15" font-weight="700" fill="#07080f">Formato neutro</text><text x="67" y="399" font-size="12" fill="#4a4d57">coverage_complete,</text><text x="67" y="416" font-size="12" fill="#4a4d57">scanners_ran, findings</text></g>
<rect x="400" y="100" width="380" height="360" rx="12" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.2"/>
<text x="414" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#4a4d57">AIDLC-SCAN</text>
<g><rect x="420" y="135" width="340" height="90" rx="9" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.4"/><text x="432" y="159" font-size="15" font-weight="700" fill="#07080f">1. Normaliza</text><text x="432" y="179" font-size="12" fill="#4a4d57">formato, scanners, cobertura,</text><text x="432" y="196" font-size="12" fill="#4a4d57">achados com chave estável</text></g>
<g><rect x="420" y="245" width="340" height="90" rx="9" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.4"/><text x="432" y="269" font-size="15" font-weight="700" fill="#07080f">2. Confere a cobertura</text><text x="432" y="289" font-size="12" fill="#4a4d57">completa? scanner exigido rodou?</text><text x="432" y="306" font-size="12" fill="#4a4d57">o baseline também?</text></g>
<g><rect x="420" y="355" width="340" height="90" rx="9" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.4"/><text x="432" y="379" font-size="15" font-weight="700" fill="#07080f">3. Aplica o limite</text><text x="432" y="399" font-size="12" fill="#4a4d57">--fail-on high (padrão)</text><text x="432" y="416" font-size="12" fill="#4a4d57">--baseline mostra o que mudou</text></g>
<path d="M325 180 L372 180 L372 180 L420 180" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M325 290 L372 290 L372 180 L420 180" fill="none" stroke="#4a4d57" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ponta-suave)"/>
<path d="M325 400 L372 400 L372 180 L420 180" fill="none" stroke="#4a4d57" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ponta-suave)"/>
<rect x="840" y="100" width="320" height="360" rx="12" fill="#f1f2f7" stroke="#d9dce6" stroke-width="1.2"/>
<text x="854" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#4a4d57">CÓDIGO DE SAÍDA</text>
<g><rect x="855" y="135" width="290" height="90" rx="9" fill="#e3f6e8" stroke="#1a7f37" stroke-width="1.4"/><text x="867" y="159" font-size="15" font-weight="700" fill="#07080f">0  limpo</text><text x="867" y="179" font-size="12" fill="#4a4d57">cobertura completa e nada</text><text x="867" y="196" font-size="12" fill="#4a4d57">no limite ou acima</text></g>
<g><rect x="855" y="245" width="290" height="90" rx="9" fill="#fde7e5" stroke="#c4281c" stroke-width="1.4"/><text x="867" y="269" font-size="15" font-weight="700" fill="#07080f">1  reprovado</text><text x="867" y="289" font-size="12" fill="#4a4d57">achado no limite ou acima</text></g>
<g><rect x="855" y="355" width="290" height="90" rx="9" fill="#fdf0d8" stroke="#9a5b00" stroke-width="1.4"/><text x="867" y="379" font-size="15" font-weight="700" fill="#07080f">2  não rodou</text><text x="867" y="399" font-size="12" fill="#4a4d57">cobertura incompleta ou</text><text x="867" y="416" font-size="12" fill="#4a4d57">desconhecida: nunca é limpo</text></g>
<path d="M760 180 L855 180" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M760 290 L855 290" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<path d="M760 400 L855 400" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="40" y="500" width="540" height="150" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="52" y="524" font-size="15" font-weight="700" fill="#07080f">No manifesto, é um gate comum</text><text x="52" y="544" font-size="12" fill="#4a4d57" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{ &quot;id&quot;: &quot;scan&quot;, &quot;blocking&quot;: true,</text><text x="52" y="561" font-size="12" fill="#4a4d57" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  &quot;cmd&quot;: &quot;aidlc-scan reports/seguranca.json</text><text x="52" y="578" font-size="12" fill="#4a4d57" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">          --require-scanners semgrep,trivy&quot; }</text></g>
<g><rect x="620" y="500" width="540" height="150" rx="9" fill="#fdf0d8" stroke="#9a5b00" stroke-width="1.4"/><text x="632" y="524" font-size="15" font-weight="700" fill="#07080f">Por que 2 e não 1</text><text x="632" y="544" font-size="12" fill="#4a4d57">Um relatório vazio pode ser &quot;nada achado&quot;</text><text x="632" y="561" font-size="12" fill="#4a4d57">ou &quot;o scanner caiu&quot;. Sem separar, uma plataforma</text><text x="632" y="578" font-size="12" fill="#4a4d57">fora do ar parece uma base limpa.</text></g>
</svg>
