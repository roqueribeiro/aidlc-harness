<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="RoqueShield and the kit: the scan loop">
<rect width="1200" height="650" fill="#ffffff"/>
<defs><marker id="ponta-roxo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker></defs>
<defs><marker id="ponta-destaque" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs>
<defs><marker id="ponta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#0f172a">RoqueShield and the kit: the scan loop</text>
<text x="32" y="68" font-size="13" fill="#475569">The platform finds, the kit enforces the result, the agent fixes. Any other platform plugs into the same spot.</text>
<rect x="40" y="100" width="330" height="320" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
<text x="54" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">ROQUESHIELD (PLATFORM)</text>
<g><rect x="60" y="135" width="290" height="85" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="72" y="159" font-size="15" font-weight="700" fill="#0f172a">1. Scan</text><text x="72" y="179" font-size="12" fill="#475569">Semgrep, Trivy, ZAP, Nuclei...</text><text x="72" y="196" font-size="12" fill="#475569">15 adapters, one contract</text></g>
<g><rect x="60" y="235" width="290" height="85" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="72" y="259" font-size="15" font-weight="700" fill="#0f172a">2. Triage</text><text x="72" y="279" font-size="12" fill="#475569">the AI reclassifies and dedupes</text><text x="72" y="296" font-size="12" fill="#475569">by deduped_key</text></g>
<g><rect x="60" y="335" width="290" height="65" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="72" y="359" font-size="15" font-weight="700" fill="#0f172a">3. AI Fix Bundle</text><text x="72" y="379" font-size="12" fill="#475569">JSON, schema 1.0.0</text></g>
<rect x="430" y="100" width="340" height="320" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="444" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">AIDLC-HARNESS (THE KIT)</text>
<g><rect x="450" y="135" width="300" height="100" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="462" y="159" font-size="15" font-weight="700" fill="#0f172a">aidlc-scan</text><text x="462" y="179" font-size="12" fill="#475569">reads the bundle (roqueshield)</text><text x="462" y="196" font-size="12" fill="#475569">is coverage complete?</text><text x="462" y="213" font-size="12" fill="#475569">did the required scanner run?</text></g>
<g><rect x="450" y="250" width="300" height="85" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="462" y="274" font-size="15" font-weight="700" fill="#0f172a">Gate in the manifest</text><text x="462" y="294" font-size="12" fill="#475569">aidlc-gate calls aidlc-scan</text><text x="462" y="311" font-size="12" fill="#475569">the Stop hook demands the output</text></g>
<g><rect x="450" y="350" width="300" height="50" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="462" y="374" font-size="13" font-weight="700" fill="#0f172a">0 clean · 1 failed · 2 did not run</text></g>
<rect x="830" y="100" width="330" height="320" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
<text x="844" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">AI AGENT</text>
<g><rect x="850" y="135" width="290" height="100" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/><text x="862" y="159" font-size="15" font-weight="700" fill="#0f172a">4. Fixes</text><text x="862" y="179" font-size="12" fill="#475569">reads the bundle by patch_priority</text><text x="862" y="196" font-size="12" fill="#475569">edits the code</text><text x="862" y="213" font-size="12" fill="#475569">Claude Code, Kiro or Copilot</text></g>
<g><rect x="850" y="250" width="290" height="85" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/><text x="862" y="274" font-size="15" font-weight="700" fill="#0f172a">5. Scans again</text><text x="862" y="294" font-size="12" fill="#475569">same target, new report</text><text x="862" y="311" font-size="12" fill="#475569">aidlc-scan --baseline before</text></g>
<g><rect x="850" y="350" width="290" height="50" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/><text x="862" y="374" font-size="13" font-weight="700" fill="#0f172a">Stops when the scan is clean</text></g>
<path d="M350 185 L450 185" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ponta-verde)"/>
<rect x="375.5" y="176" width="49" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="400" y="189" font-size="11" text-anchor="middle" fill="#475569">bundle</text>
<path d="M770 185 L850 185" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ponta-destaque)"/>
<rect x="782.5" y="176" width="55" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="810" y="189" font-size="11" text-anchor="middle" fill="#475569">decides</text>
<path d="M995 420 L995 455 L240 455 L240 420" fill="none" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#ponta-roxo)"/>
<rect x="421" y="446" width="393" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="617.5" y="459" font-size="11" text-anchor="middle" fill="#475569">repeats until the scan is clean with coverage still complete</text>
<g><rect x="40" y="495" width="540" height="120" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="52" y="519" font-size="15" font-weight="700" fill="#0f172a">Any other platform plugs in the same way</text><text x="52" y="539" font-size="12" fill="#475569">SARIF 2.1.0: Semgrep, CodeQL, Trivy and others</text><text x="52" y="556" font-size="12" fill="#475569">Neutral format: a short conversion</text><text x="52" y="573" font-size="12" fill="#475569">Only --format and the scanner name change</text></g>
<g><rect x="620" y="495" width="540" height="120" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="632" y="519" font-size="15" font-weight="700" fill="#0f172a">What the kit does not assume</text><text x="632" y="539" font-size="12" fill="#475569">That the platform is up: with no report,</text><text x="632" y="556" font-size="12" fill="#475569">the exit is 2 (did not run), never clean.</text><text x="632" y="573" font-size="12" fill="#475569">Integration validated against its documentation.</text></g>
</svg>
