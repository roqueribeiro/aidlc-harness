<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Instalação">
<rect width="1200" height="600" fill="#0b1220"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#e2e8f0">Instalação, do zero ao primeiro gate</text>
<text x="32" y="68" font-size="13" fill="#94a3b8">Um comando por máquina; depois, um comando por projeto.</text>
<g><rect x="40" y="130" width="210" height="110" rx="9" fill="#13284d" stroke="#60a5fa" stroke-width="1.4"/><text x="52" y="154" font-size="15" font-weight="700" fill="#e2e8f0">Instalar o kit</text><text x="52" y="174" font-size="12" fill="#94a3b8">npm install -g, com</text><text x="52" y="191" font-size="12" fill="#94a3b8">o pacote do GitHub</text></g>
<circle cx="52" cy="118" r="11" fill="#60a5fa"/><text x="52" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#0b1220">1</text>
<path d="M250 185 L266 185" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="266" y="130" width="210" height="110" rx="9" fill="#111a2e" stroke="#334155" stroke-width="1.4"/><text x="278" y="154" font-size="15" font-weight="700" fill="#e2e8f0">Plugin no Claude Code</text><text x="278" y="174" font-size="12" fill="#94a3b8">só para quem usa</text><text x="278" y="191" font-size="12" fill="#94a3b8">o Claude Code</text></g>
<circle cx="278" cy="118" r="11" fill="#60a5fa"/><text x="278" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#0b1220">2</text>
<path d="M476 185 L492 185" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="492" y="130" width="210" height="110" rx="9" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.4"/><text x="504" y="154" font-size="15" font-weight="700" fill="#e2e8f0">aidlc-init</text><text x="504" y="174" font-size="12" fill="#94a3b8">pergunta as ferramentas e</text><text x="504" y="191" font-size="12" fill="#94a3b8">gera a camada de cada uma</text></g>
<circle cx="504" cy="118" r="11" fill="#60a5fa"/><text x="504" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#0b1220">3</text>
<path d="M702 185 L718 185" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="718" y="130" width="210" height="110" rx="9" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.4"/><text x="730" y="154" font-size="15" font-weight="700" fill="#e2e8f0">Inception</text><text x="730" y="174" font-size="12" fill="#94a3b8">o comando da ferramenta,</text><text x="730" y="191" font-size="12" fill="#94a3b8">com uma frase do pedido</text></g>
<circle cx="730" cy="118" r="11" fill="#60a5fa"/><text x="730" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#0b1220">4</text>
<path d="M928 185 L944 185" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="944" y="130" width="210" height="110" rx="9" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.4"/><text x="956" y="154" font-size="15" font-weight="700" fill="#e2e8f0">doctor e gate</text><text x="956" y="174" font-size="12" fill="#94a3b8">nota do repositório e o</text><text x="956" y="191" font-size="12" fill="#94a3b8">critério de aceite rodando</text></g>
<circle cx="956" cy="118" r="11" fill="#60a5fa"/><text x="956" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#0b1220">5</text>
<g><rect x="40" y="300" width="540" height="130" rx="9" fill="#111a2e" stroke="#334155" stroke-width="1.4"/><text x="52" y="324" font-size="15" font-weight="700" fill="#e2e8f0">Só experimentar</text><text x="52" y="344" font-size="12" fill="#94a3b8">npx github:roqueribeiro/aidlc-harness init</text><text x="52" y="361" font-size="12" fill="#94a3b8">roda sem instalar nada; os hooks do Copilot,</text><text x="52" y="378" font-size="12" fill="#94a3b8">do Cursor e do Codex pedem a instalação</text></g>
<g><rect x="620" y="300" width="540" height="130" rx="9" fill="#111a2e" stroke="#334155" stroke-width="1.4"/><text x="632" y="324" font-size="15" font-weight="700" fill="#e2e8f0">Linux, macOS e Windows</text><text x="632" y="344" font-size="12" fill="#94a3b8">o npm cria os atalhos de cada sistema;</text><text x="632" y="361" font-size="12" fill="#94a3b8">o CI testa a instalação do pacote</text><text x="632" y="378" font-size="12" fill="#94a3b8">nos três, a cada push</text></g>
<g><rect x="40" y="470" width="1120" height="100" rx="9" fill="#0f2a1b" stroke="#4ade80" stroke-width="1.4"/><text x="52" y="494" font-size="15" font-weight="700" fill="#e2e8f0">Sem dependências de execução</text><text x="52" y="514" font-size="12" fill="#94a3b8">O kit é Node puro: não instala nenhum pacote de terceiros. Requer Node 20.19 ou mais novo e git.</text></g>
</svg>
