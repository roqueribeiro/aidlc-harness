<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Instalação">
<rect width="1200" height="600" fill="#07080f"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0b2b8"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#f2f4fa">Instalação, do zero ao primeiro gate</text>
<text x="32" y="68" font-size="13" fill="#b0b2b8">Um comando por projeto. Nada para instalar na máquina.</text>
<g><rect x="40" y="130" width="210" height="110" rx="9" fill="#0a1a36" stroke="#3d96ff" stroke-width="1.4"/><text x="52" y="154" font-size="15" font-weight="700" fill="#f2f4fa">npx ... init</text><text x="52" y="174" font-size="12" fill="#b0b2b8">um comando, na pasta</text><text x="52" y="191" font-size="12" fill="#b0b2b8">do projeto</text></g>
<circle cx="52" cy="118" r="11" fill="#3d96ff"/><text x="52" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#07080f">1</text>
<path d="M250 185 L266 185" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="266" y="130" width="210" height="110" rx="9" fill="#0b2214" stroke="#34c759" stroke-width="1.4"/><text x="278" y="154" font-size="15" font-weight="700" fill="#f2f4fa">Cópia do kit</text><text x="278" y="174" font-size="12" fill="#b0b2b8">.aidlc/kit/ vai no git;</text><text x="278" y="191" font-size="12" fill="#b0b2b8">hooks e gate rodam dela</text></g>
<circle cx="278" cy="118" r="11" fill="#3d96ff"/><text x="278" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#07080f">2</text>
<path d="M476 185 L492 185" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="492" y="130" width="210" height="110" rx="9" fill="#0b2214" stroke="#34c759" stroke-width="1.4"/><text x="504" y="154" font-size="15" font-weight="700" fill="#f2f4fa">Abrir a ferramenta</text><text x="504" y="174" font-size="12" fill="#b0b2b8">Claude Code: aceite a</text><text x="504" y="191" font-size="12" fill="#b0b2b8">confiança e o plugin vem</text></g>
<circle cx="504" cy="118" r="11" fill="#3d96ff"/><text x="504" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#07080f">3</text>
<path d="M702 185 L718 185" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="718" y="130" width="210" height="110" rx="9" fill="#0b2214" stroke="#34c759" stroke-width="1.4"/><text x="730" y="154" font-size="15" font-weight="700" fill="#f2f4fa">Inception</text><text x="730" y="174" font-size="12" fill="#b0b2b8">o comando da ferramenta,</text><text x="730" y="191" font-size="12" fill="#b0b2b8">com uma frase do pedido</text></g>
<circle cx="730" cy="118" r="11" fill="#3d96ff"/><text x="730" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#07080f">4</text>
<path d="M928 185 L944 185" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="944" y="130" width="210" height="110" rx="9" fill="#0b2214" stroke="#34c759" stroke-width="1.4"/><text x="956" y="154" font-size="15" font-weight="700" fill="#f2f4fa">Primeiro gate</text><text x="956" y="174" font-size="12" fill="#b0b2b8">o Trivy é baixado e</text><text x="956" y="191" font-size="12" fill="#b0b2b8">conferido por sha256</text></g>
<circle cx="956" cy="118" r="11" fill="#3d96ff"/><text x="956" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#07080f">5</text>
<g><rect x="40" y="300" width="540" height="130" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="52" y="324" font-size="15" font-weight="700" fill="#f2f4fa">O colega que só clona</text><text x="52" y="344" font-size="12" fill="#b0b2b8">tudo funciona sem instalar: a cópia do kit</text><text x="52" y="361" font-size="12" fill="#b0b2b8">vem no git, e o CI reprova cópia alterada</text><text x="52" y="378" font-size="12" fill="#b0b2b8">com o kit fixado na versão</text></g>
<g><rect x="620" y="300" width="540" height="130" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="632" y="324" font-size="15" font-weight="700" fill="#f2f4fa">Linux, macOS e Windows</text><text x="632" y="344" font-size="12" fill="#b0b2b8">o CI roda essa primeira execução sem</text><text x="632" y="361" font-size="12" fill="#b0b2b8">aidlc no PATH e com o home vazio,</text><text x="632" y="378" font-size="12" fill="#b0b2b8">nos três, a cada push</text></g>
<g><rect x="40" y="470" width="1120" height="100" rx="9" fill="#0b2214" stroke="#34c759" stroke-width="1.4"/><text x="52" y="494" font-size="15" font-weight="700" fill="#f2f4fa">Sem dependências de execução</text><text x="52" y="514" font-size="12" fill="#b0b2b8">O kit é Node puro: não instala nenhum pacote de terceiros. Requer Node 20.19 ou mais novo e git.</text></g>
</svg>
