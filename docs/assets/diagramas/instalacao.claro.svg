<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Instalação">
<rect width="1200" height="600" fill="#ffffff"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#0f172a">Instalação, do clone ao primeiro gate</text>
<text x="32" y="68" font-size="13" fill="#475569">Uma máquina, uma vez; depois, um comando por projeto.</text>
<g><rect x="40" y="130" width="210" height="110" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="52" y="154" font-size="15" font-weight="700" fill="#0f172a">Obter o kit</text><text x="52" y="174" font-size="12" fill="#475569">git clone do repositório</text><text x="52" y="191" font-size="12" fill="#475569">ou o marketplace aidlc</text></g>
<circle cx="52" cy="118" r="11" fill="#2563eb"/><text x="52" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<path d="M250 185 L266 185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="266" y="130" width="210" height="110" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="278" y="154" font-size="15" font-weight="700" fill="#0f172a">scripts/setup.mjs</text><text x="278" y="174" font-size="12" fill="#475569">põe os aidlc-* no PATH</text><text x="278" y="191" font-size="12" fill="#475569">--check e --uninstall</text></g>
<circle cx="278" cy="118" r="11" fill="#2563eb"/><text x="278" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<path d="M476 185 L492 185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="492" y="130" width="210" height="110" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="504" y="154" font-size="15" font-weight="700" fill="#0f172a">Plugin no Claude Code</text><text x="504" y="174" font-size="12" fill="#475569">marketplace add e</text><text x="504" y="191" font-size="12" fill="#475569">plugin install</text></g>
<circle cx="504" cy="118" r="11" fill="#2563eb"/><text x="504" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<path d="M702 185 L718 185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="718" y="130" width="210" height="110" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="730" y="154" font-size="15" font-weight="700" fill="#0f172a">aidlc-init</text><text x="730" y="174" font-size="12" fill="#475569">esqueleto do projeto e</text><text x="730" y="191" font-size="12" fill="#475569">instruções das 3 IAs</text></g>
<circle cx="730" cy="118" r="11" fill="#2563eb"/><text x="730" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<path d="M928 185 L944 185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="944" y="130" width="210" height="110" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="956" y="154" font-size="15" font-weight="700" fill="#0f172a">doctor e gate</text><text x="956" y="174" font-size="12" fill="#475569">nota do repositório e o</text><text x="956" y="191" font-size="12" fill="#475569">critério de aceite rodando</text></g>
<circle cx="956" cy="118" r="11" fill="#2563eb"/><text x="956" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<g><rect x="40" y="300" width="540" height="130" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="52" y="324" font-size="15" font-weight="700" fill="#0f172a">Opcional, por clone</text><text x="52" y="344" font-size="12" fill="#475569">node scripts/install-git-hooks.mjs</text><text x="52" y="361" font-size="12" fill="#475569">instala o pre-push que roda o aidlc-gate</text><text x="52" y="378" font-size="12" fill="#475569">e nunca sobrescreve hook alheio</text></g>
<g><rect x="620" y="300" width="540" height="130" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="632" y="324" font-size="15" font-weight="700" fill="#0f172a">Para publicar o seu fork</text><text x="632" y="344" font-size="12" fill="#475569">node scripts/definir-dono.mjs --owner &lt;org&gt;</text><text x="632" y="361" font-size="12" fill="#475569">troca os marcadores de dono e de</text><text x="632" y="378" font-size="12" fill="#475569">contato; --check lista o que falta</text></g>
<g><rect x="40" y="470" width="1120" height="100" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="52" y="494" font-size="15" font-weight="700" fill="#0f172a">Sem dependências de execução</text><text x="52" y="514" font-size="12" fill="#475569">O kit é Node puro: não há npm install nem yarn install para o kit em si. Requer Node 20.19 ou mais novo e git.</text></g>
</svg>
