<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="RoqueShield e o kit: o laço de varredura">
<rect width="1200" height="650" fill="#ffffff"/>
<defs><marker id="ponta-roxo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4c51bf"/></marker></defs>
<defs><marker id="ponta-destaque" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0066cc"/></marker></defs>
<defs><marker id="ponta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#07080f">RoqueShield e o kit: o laço de varredura</text>
<text x="32" y="68" font-size="13" fill="#4a4d57">A plataforma acha, o kit cobra o resultado, o agente corrige. Qualquer outra plataforma entra no mesmo lugar.</text>
<rect x="40" y="100" width="330" height="320" rx="12" fill="#e3f6e8" stroke="#1a7f37" stroke-width="1.2"/>
<text x="54" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#4a4d57">ROQUESHIELD (PLATAFORMA)</text>
<g><rect x="60" y="135" width="290" height="85" rx="9" fill="#e3f6e8" stroke="#1a7f37" stroke-width="1.4"/><text x="72" y="159" font-size="15" font-weight="700" fill="#07080f">1. Varredura</text><text x="72" y="179" font-size="12" fill="#4a4d57">Semgrep, Trivy, ZAP, Nuclei...</text><text x="72" y="196" font-size="12" fill="#4a4d57">15 adaptadores, um contrato</text></g>
<g><rect x="60" y="235" width="290" height="85" rx="9" fill="#e3f6e8" stroke="#1a7f37" stroke-width="1.4"/><text x="72" y="259" font-size="15" font-weight="700" fill="#07080f">2. Triagem</text><text x="72" y="279" font-size="12" fill="#4a4d57">a IA reclassifica e deduplica</text><text x="72" y="296" font-size="12" fill="#4a4d57">por deduped_key</text></g>
<g><rect x="60" y="335" width="290" height="65" rx="9" fill="#e3f6e8" stroke="#1a7f37" stroke-width="1.4"/><text x="72" y="359" font-size="15" font-weight="700" fill="#07080f">3. AI Fix Bundle</text><text x="72" y="379" font-size="12" fill="#4a4d57">JSON, schema 1.0.0</text></g>
<rect x="430" y="100" width="340" height="320" rx="12" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.2"/>
<text x="444" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#4a4d57">AIDLC-HARNESS (O KIT)</text>
<g><rect x="450" y="135" width="300" height="100" rx="9" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.4"/><text x="462" y="159" font-size="15" font-weight="700" fill="#07080f">aidlc-scan</text><text x="462" y="179" font-size="12" fill="#4a4d57">lê o bundle (roqueshield)</text><text x="462" y="196" font-size="12" fill="#4a4d57">a cobertura está completa?</text><text x="462" y="213" font-size="12" fill="#4a4d57">o scanner exigido rodou?</text></g>
<g><rect x="450" y="250" width="300" height="85" rx="9" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.4"/><text x="462" y="274" font-size="15" font-weight="700" fill="#07080f">Gate no manifesto</text><text x="462" y="294" font-size="12" fill="#4a4d57">aidlc-gate chama o aidlc-scan</text><text x="462" y="311" font-size="12" fill="#4a4d57">o hook de Stop cobra a saída</text></g>
<g><rect x="450" y="350" width="300" height="50" rx="9" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.4"/><text x="462" y="374" font-size="13" font-weight="700" fill="#07080f">0 limpo · 1 reprovado · 2 não rodou</text></g>
<rect x="830" y="100" width="330" height="320" rx="12" fill="#ebedfd" stroke="#4c51bf" stroke-width="1.2"/>
<text x="844" y="122" font-size="12" font-weight="700" letter-spacing="0.6" fill="#4a4d57">AGENTE DE IA</text>
<g><rect x="850" y="135" width="290" height="100" rx="9" fill="#ebedfd" stroke="#4c51bf" stroke-width="1.4"/><text x="862" y="159" font-size="15" font-weight="700" fill="#07080f">4. Corrige</text><text x="862" y="179" font-size="12" fill="#4a4d57">lê o bundle por patch_priority</text><text x="862" y="196" font-size="12" fill="#4a4d57">edita o código</text><text x="862" y="213" font-size="12" fill="#4a4d57">Claude Code, Kiro ou Copilot</text></g>
<g><rect x="850" y="250" width="290" height="85" rx="9" fill="#ebedfd" stroke="#4c51bf" stroke-width="1.4"/><text x="862" y="274" font-size="15" font-weight="700" fill="#07080f">5. Varre de novo</text><text x="862" y="294" font-size="12" fill="#4a4d57">mesmo alvo, novo relatório</text><text x="862" y="311" font-size="12" fill="#4a4d57">aidlc-scan --baseline antes</text></g>
<g><rect x="850" y="350" width="290" height="50" rx="9" fill="#ebedfd" stroke="#4c51bf" stroke-width="1.4"/><text x="862" y="374" font-size="13" font-weight="700" fill="#07080f">Para quando o scan limpa</text></g>
<path d="M350 185 L450 185" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#ponta-verde)"/>
<rect x="375.5" y="176" width="49" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="400" y="189" font-size="11" text-anchor="middle" fill="#4a4d57">bundle</text>
<path d="M770 185 L850 185" fill="none" stroke="#0066cc" stroke-width="1.6" marker-end="url(#ponta-destaque)"/>
<rect x="785.5" y="176" width="49" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="810" y="189" font-size="11" text-anchor="middle" fill="#4a4d57">decide</text>
<path d="M995 420 L995 455 L240 455 L240 420" fill="none" stroke="#4c51bf" stroke-width="1.6" marker-end="url(#ponta-roxo)"/>
<rect x="437" y="446" width="361" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="617.5" y="459" font-size="11" text-anchor="middle" fill="#4a4d57">repete até o scan limpar com a cobertura ainda completa</text>
<g><rect x="40" y="495" width="540" height="120" rx="9" fill="#e3f6e8" stroke="#1a7f37" stroke-width="1.4"/><text x="52" y="519" font-size="15" font-weight="700" fill="#07080f">Qualquer outra plataforma entra igual</text><text x="52" y="539" font-size="12" fill="#4a4d57">SARIF 2.1.0: Semgrep, CodeQL, Trivy e outras</text><text x="52" y="556" font-size="12" fill="#4a4d57">Formato neutro: uma conversão curta</text><text x="52" y="573" font-size="12" fill="#4a4d57">Só mudam o --format e o nome do scanner</text></g>
<g><rect x="620" y="495" width="540" height="120" rx="9" fill="#fdf0d8" stroke="#9a5b00" stroke-width="1.4"/><text x="632" y="519" font-size="15" font-weight="700" fill="#07080f">O que o kit não presume</text><text x="632" y="539" font-size="12" fill="#4a4d57">Que a plataforma esteja no ar: sem relatório,</text><text x="632" y="556" font-size="12" fill="#4a4d57">a saída é 2 (não rodou), nunca limpo.</text><text x="632" y="573" font-size="12" fill="#4a4d57">Integração validada contra a documentação dela.</text></g>
</svg>
