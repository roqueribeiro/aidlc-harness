<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Ciclo de vida dos hooks">
<rect width="1200" height="700" fill="#ffffff"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#0f172a">Ciclo de vida dos hooks</text>
<text x="32" y="68" font-size="13" fill="#475569">Cinco eventos do Claude Code; cada um tem um dono, e quase tudo roda em menos de 70 ms.</text>
<g><rect x="40" y="100" width="210" height="78" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="52" y="124" font-size="15" font-weight="700" fill="#0f172a">SessionStart</text><text x="52" y="144" font-size="12" fill="#475569">ao abrir ou retomar</text></g>
<g><rect x="40" y="200" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="52" y="224" font-size="15" font-weight="700" fill="#0f172a">session-brief</text><text x="52" y="244" font-size="12" fill="#475569">anuncia stack, gates</text><text x="52" y="261" font-size="12" fill="#475569">e fase em curso</text></g>
<path d="M250 139 L266 139" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="266" y="100" width="210" height="78" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="278" y="124" font-size="15" font-weight="700" fill="#0f172a">UserPromptSubmit</text><text x="278" y="144" font-size="12" fill="#475569">a cada prompt</text></g>
<g><rect x="266" y="200" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="278" y="224" font-size="15" font-weight="700" fill="#0f172a">strategy-map</text><text x="278" y="244" font-size="12" fill="#475569">reinjeta o mapa de regras</text><text x="278" y="261" font-size="12" fill="#475569">sobrevive ao /compact</text></g>
<path d="M476 139 L492 139" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="492" y="100" width="210" height="78" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="504" y="124" font-size="15" font-weight="700" fill="#0f172a">PreToolUse</text><text x="504" y="144" font-size="12" fill="#475569">antes de Bash/Write/Edit</text></g>
<g><rect x="492" y="200" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="504" y="224" font-size="15" font-weight="700" fill="#0f172a">scratch-guard</text><text x="504" y="244" font-size="12" fill="#475569">rascunho só na pasta</text><text x="504" y="261" font-size="12" fill="#475569">de scratch (opt-in)</text></g>
<g><rect x="492" y="300" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="504" y="324" font-size="15" font-weight="700" fill="#0f172a">pkg-manager</text><text x="504" y="344" font-size="12" fill="#475569">yarn ou npm conforme</text><text x="504" y="361" font-size="12" fill="#475569">o manifesto do repo</text></g>
<g><rect x="492" y="400" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="504" y="424" font-size="15" font-weight="700" fill="#0f172a">secret-guard</text><text x="504" y="444" font-size="12" fill="#475569">barra echo/cat de</text><text x="504" y="461" font-size="12" fill="#475569">segredo e dump de env</text></g>
<path d="M702 139 L718 139" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="718" y="100" width="210" height="78" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="730" y="124" font-size="15" font-weight="700" fill="#0f172a">PostToolUse</text><text x="730" y="144" font-size="12" fill="#475569">depois de Edit/Write</text></g>
<g><rect x="718" y="200" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="730" y="224" font-size="15" font-weight="700" fill="#0f172a">path-strategy</text><text x="730" y="244" font-size="12" fill="#475569">entrega a regra do</text><text x="730" y="261" font-size="12" fill="#475569">arquivo que mudou</text></g>
<path d="M928 139 L944 139" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="944" y="100" width="210" height="78" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="956" y="124" font-size="15" font-weight="700" fill="#0f172a">Stop</text><text x="956" y="144" font-size="12" fill="#475569">quando o agente quer parar</text></g>
<g><rect x="944" y="200" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="956" y="224" font-size="15" font-weight="700" fill="#0f172a">dod-check</text><text x="956" y="244" font-size="12" fill="#475569">exige a evidência do</text><text x="956" y="261" font-size="12" fill="#475569">manifesto no chat</text></g>
<g><rect x="944" y="300" width="210" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="956" y="324" font-size="15" font-weight="700" fill="#0f172a">promise-check</text><text x="956" y="344" font-size="12" fill="#475569">barra &quot;faço depois&quot;</text><text x="956" y="361" font-size="12" fill="#475569">sem ter feito</text></g>
<rect x="40" y="520" width="1120" height="150" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="54" y="542" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569">RESULTADO DE CADA HOOK</text>
<g><rect x="60" y="555" width="340" height="90" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/><text x="72" y="579" font-size="15" font-weight="700" fill="#0f172a">exit 2: bloqueia</text><text x="72" y="599" font-size="12" fill="#475569">PreToolUse impede o comando</text><text x="72" y="616" font-size="12" fill="#475569">e diz o que usar no lugar</text></g>
<g><rect x="420" y="555" width="340" height="90" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="432" y="579" font-size="15" font-weight="700" fill="#0f172a">contexto adicional</text><text x="432" y="599" font-size="12" fill="#475569">SessionStart, UserPromptSubmit</text><text x="432" y="616" font-size="12" fill="#475569">e PostToolUse entregam texto</text></g>
<g><rect x="780" y="555" width="360" height="90" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="792" y="579" font-size="15" font-weight="700" fill="#0f172a">recusa o fim do turno</text><text x="792" y="599" font-size="12" fill="#475569">Stop pede a evidência; depois de</text><text x="792" y="616" font-size="12" fill="#475569">3 recusas vira aviso e libera</text></g>
</svg>
