<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Ciclo de vida dos hooks">
<rect width="1200" height="700" fill="#ffffff"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4d57"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#07080f">Ciclo de vida dos hooks</text>
<text x="32" y="68" font-size="13" fill="#4a4d57">Cinco eventos do Claude Code; cada um tem um dono, e quase tudo roda em menos de 70 ms.</text>
<g><rect x="40" y="100" width="210" height="78" rx="9" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.4"/><text x="52" y="124" font-size="15" font-weight="700" fill="#07080f">SessionStart</text><text x="52" y="144" font-size="12" fill="#4a4d57">ao abrir ou retomar</text></g>
<g><rect x="40" y="200" width="210" height="86" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="52" y="224" font-size="15" font-weight="700" fill="#07080f">session-brief</text><text x="52" y="244" font-size="12" fill="#4a4d57">anuncia stack, gates</text><text x="52" y="261" font-size="12" fill="#4a4d57">e fase em curso</text></g>
<path d="M250 139 L266 139" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="266" y="100" width="210" height="78" rx="9" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.4"/><text x="278" y="124" font-size="15" font-weight="700" fill="#07080f">UserPromptSubmit</text><text x="278" y="144" font-size="12" fill="#4a4d57">a cada prompt</text></g>
<g><rect x="266" y="200" width="210" height="86" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="278" y="224" font-size="15" font-weight="700" fill="#07080f">strategy-map</text><text x="278" y="244" font-size="12" fill="#4a4d57">reinjeta o mapa de regras</text><text x="278" y="261" font-size="12" fill="#4a4d57">sobrevive ao /compact</text></g>
<path d="M476 139 L492 139" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="492" y="100" width="210" height="78" rx="9" fill="#fde7e5" stroke="#c4281c" stroke-width="1.4"/><text x="504" y="124" font-size="15" font-weight="700" fill="#07080f">PreToolUse</text><text x="504" y="144" font-size="12" fill="#4a4d57">antes de Bash/Write/Edit</text></g>
<g><rect x="492" y="200" width="210" height="86" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="504" y="224" font-size="15" font-weight="700" fill="#07080f">scratch-guard</text><text x="504" y="244" font-size="12" fill="#4a4d57">rascunho só na pasta</text><text x="504" y="261" font-size="12" fill="#4a4d57">de scratch (opt-in)</text></g>
<g><rect x="492" y="300" width="210" height="86" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="504" y="324" font-size="15" font-weight="700" fill="#07080f">pkg-manager</text><text x="504" y="344" font-size="12" fill="#4a4d57">yarn ou npm conforme</text><text x="504" y="361" font-size="12" fill="#4a4d57">o manifesto do repo</text></g>
<g><rect x="492" y="400" width="210" height="86" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="504" y="424" font-size="15" font-weight="700" fill="#07080f">secret-guard</text><text x="504" y="444" font-size="12" fill="#4a4d57">barra echo/cat de</text><text x="504" y="461" font-size="12" fill="#4a4d57">segredo e dump de env</text></g>
<path d="M702 139 L718 139" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="718" y="100" width="210" height="78" rx="9" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.4"/><text x="730" y="124" font-size="15" font-weight="700" fill="#07080f">PostToolUse</text><text x="730" y="144" font-size="12" fill="#4a4d57">depois de Edit/Write</text></g>
<g><rect x="718" y="200" width="210" height="86" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="730" y="224" font-size="15" font-weight="700" fill="#07080f">path-strategy</text><text x="730" y="244" font-size="12" fill="#4a4d57">entrega a regra do</text><text x="730" y="261" font-size="12" fill="#4a4d57">arquivo que mudou</text></g>
<path d="M928 139 L944 139" fill="none" stroke="#4a4d57" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="944" y="100" width="210" height="78" rx="9" fill="#fdf0d8" stroke="#9a5b00" stroke-width="1.4"/><text x="956" y="124" font-size="15" font-weight="700" fill="#07080f">Stop</text><text x="956" y="144" font-size="12" fill="#4a4d57">quando o agente quer parar</text></g>
<g><rect x="944" y="200" width="210" height="86" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="956" y="224" font-size="15" font-weight="700" fill="#07080f">dod-check</text><text x="956" y="244" font-size="12" fill="#4a4d57">exige a evidência do</text><text x="956" y="261" font-size="12" fill="#4a4d57">manifesto no chat</text></g>
<g><rect x="944" y="300" width="210" height="86" rx="9" fill="#f6f7fb" stroke="#d9dce6" stroke-width="1.4"/><text x="956" y="324" font-size="15" font-weight="700" fill="#07080f">promise-check</text><text x="956" y="344" font-size="12" fill="#4a4d57">barra &quot;faço depois&quot;</text><text x="956" y="361" font-size="12" fill="#4a4d57">sem ter feito</text></g>
<rect x="40" y="520" width="1120" height="150" rx="12" fill="#f1f2f7" stroke="#d9dce6" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="54" y="542" font-size="12" font-weight="700" letter-spacing="0.6" fill="#4a4d57">RESULTADO DE CADA HOOK</text>
<g><rect x="60" y="555" width="340" height="90" rx="9" fill="#fde7e5" stroke="#c4281c" stroke-width="1.4"/><text x="72" y="579" font-size="15" font-weight="700" fill="#07080f">exit 2: bloqueia</text><text x="72" y="599" font-size="12" fill="#4a4d57">PreToolUse impede o comando</text><text x="72" y="616" font-size="12" fill="#4a4d57">e diz o que usar no lugar</text></g>
<g><rect x="420" y="555" width="340" height="90" rx="9" fill="#e6f0ff" stroke="#0066cc" stroke-width="1.4"/><text x="432" y="579" font-size="15" font-weight="700" fill="#07080f">contexto adicional</text><text x="432" y="599" font-size="12" fill="#4a4d57">SessionStart, UserPromptSubmit</text><text x="432" y="616" font-size="12" fill="#4a4d57">e PostToolUse entregam texto</text></g>
<g><rect x="780" y="555" width="360" height="90" rx="9" fill="#fdf0d8" stroke="#9a5b00" stroke-width="1.4"/><text x="792" y="579" font-size="15" font-weight="700" fill="#07080f">recusa o fim do turno</text><text x="792" y="599" font-size="12" fill="#4a4d57">Stop pede a evidência; depois de</text><text x="792" y="616" font-size="12" fill="#4a4d57">3 recusas vira aviso e libera</text></g>
</svg>
