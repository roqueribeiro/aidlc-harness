<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Hook lifecycle">
<rect width="1200" height="700" fill="#07080f"/>
<defs><marker id="ponta-suave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0b2b8"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="700" fill="#f2f4fa">Hook lifecycle</text>
<text x="32" y="68" font-size="13" fill="#b0b2b8">Five Claude Code events; each one has an owner, and almost everything runs in under 70 ms.</text>
<g><rect x="40" y="100" width="210" height="78" rx="9" fill="#0a1a36" stroke="#3d96ff" stroke-width="1.4"/><text x="52" y="124" font-size="15" font-weight="700" fill="#f2f4fa">SessionStart</text><text x="52" y="144" font-size="12" fill="#b0b2b8">on open or resume</text></g>
<g><rect x="40" y="200" width="210" height="86" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="52" y="224" font-size="15" font-weight="700" fill="#f2f4fa">session-brief</text><text x="52" y="244" font-size="12" fill="#b0b2b8">announces stack, gates</text><text x="52" y="261" font-size="12" fill="#b0b2b8">and the current phase</text></g>
<path d="M250 139 L266 139" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="266" y="100" width="210" height="78" rx="9" fill="#0a1a36" stroke="#3d96ff" stroke-width="1.4"/><text x="278" y="124" font-size="15" font-weight="700" fill="#f2f4fa">UserPromptSubmit</text><text x="278" y="144" font-size="12" fill="#b0b2b8">on every prompt</text></g>
<g><rect x="266" y="200" width="210" height="86" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="278" y="224" font-size="15" font-weight="700" fill="#f2f4fa">strategy-map</text><text x="278" y="244" font-size="12" fill="#b0b2b8">reinjects the rule map</text><text x="278" y="261" font-size="12" fill="#b0b2b8">survives /compact</text></g>
<path d="M476 139 L492 139" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="492" y="100" width="210" height="78" rx="9" fill="#2c0f0e" stroke="#ff5a52" stroke-width="1.4"/><text x="504" y="124" font-size="15" font-weight="700" fill="#f2f4fa">PreToolUse</text><text x="504" y="144" font-size="12" fill="#b0b2b8">before Bash/Write/Edit</text></g>
<g><rect x="492" y="200" width="210" height="86" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="504" y="224" font-size="15" font-weight="700" fill="#f2f4fa">scratch-guard</text><text x="504" y="244" font-size="12" fill="#b0b2b8">drafts only in the</text><text x="504" y="261" font-size="12" fill="#b0b2b8">scratch folder (opt-in)</text></g>
<g><rect x="492" y="300" width="210" height="86" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="504" y="324" font-size="15" font-weight="700" fill="#f2f4fa">pkg-manager</text><text x="504" y="344" font-size="12" fill="#b0b2b8">yarn or npm as set by</text><text x="504" y="361" font-size="12" fill="#b0b2b8">the repo manifest</text></g>
<g><rect x="492" y="400" width="210" height="86" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="504" y="424" font-size="15" font-weight="700" fill="#f2f4fa">secret-guard</text><text x="504" y="444" font-size="12" fill="#b0b2b8">blocks echo/cat of</text><text x="504" y="461" font-size="12" fill="#b0b2b8">secrets and env dumps</text></g>
<path d="M702 139 L718 139" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="718" y="100" width="210" height="78" rx="9" fill="#0a1a36" stroke="#3d96ff" stroke-width="1.4"/><text x="730" y="124" font-size="15" font-weight="700" fill="#f2f4fa">PostToolUse</text><text x="730" y="144" font-size="12" fill="#b0b2b8">after Edit/Write</text></g>
<g><rect x="718" y="200" width="210" height="86" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="730" y="224" font-size="15" font-weight="700" fill="#f2f4fa">path-strategy</text><text x="730" y="244" font-size="12" fill="#b0b2b8">delivers the rule for</text><text x="730" y="261" font-size="12" fill="#b0b2b8">the file that changed</text></g>
<path d="M928 139 L944 139" fill="none" stroke="#b0b2b8" stroke-width="1.6" marker-end="url(#ponta-suave)"/>
<g><rect x="944" y="100" width="210" height="78" rx="9" fill="#2a1d06" stroke="#f59e0b" stroke-width="1.4"/><text x="956" y="124" font-size="15" font-weight="700" fill="#f2f4fa">Stop</text><text x="956" y="144" font-size="12" fill="#b0b2b8">when the agent stops</text></g>
<g><rect x="944" y="200" width="210" height="86" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="956" y="224" font-size="15" font-weight="700" fill="#f2f4fa">dod-check</text><text x="956" y="244" font-size="12" fill="#b0b2b8">requires the evidence from</text><text x="956" y="261" font-size="12" fill="#b0b2b8">the manifest in the chat</text></g>
<g><rect x="944" y="300" width="210" height="86" rx="9" fill="#0d0f1a" stroke="#262938" stroke-width="1.4"/><text x="956" y="324" font-size="15" font-weight="700" fill="#f2f4fa">promise-check</text><text x="956" y="344" font-size="12" fill="#b0b2b8">blocks &quot;I will do it later&quot;</text><text x="956" y="361" font-size="12" fill="#b0b2b8">without having done it</text></g>
<rect x="40" y="520" width="1120" height="150" rx="12" fill="#0a0b14" stroke="#262938" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="54" y="542" font-size="12" font-weight="700" letter-spacing="0.6" fill="#b0b2b8">WHAT EACH HOOK PRODUCES</text>
<g><rect x="60" y="555" width="340" height="90" rx="9" fill="#2c0f0e" stroke="#ff5a52" stroke-width="1.4"/><text x="72" y="579" font-size="15" font-weight="700" fill="#f2f4fa">exit 2: blocks</text><text x="72" y="599" font-size="12" fill="#b0b2b8">PreToolUse stops the command</text><text x="72" y="616" font-size="12" fill="#b0b2b8">and says what to use instead</text></g>
<g><rect x="420" y="555" width="340" height="90" rx="9" fill="#0a1a36" stroke="#3d96ff" stroke-width="1.4"/><text x="432" y="579" font-size="15" font-weight="700" fill="#f2f4fa">additional context</text><text x="432" y="599" font-size="12" fill="#b0b2b8">SessionStart, UserPromptSubmit</text><text x="432" y="616" font-size="12" fill="#b0b2b8">and PostToolUse deliver text</text></g>
<g><rect x="780" y="555" width="360" height="90" rx="9" fill="#2a1d06" stroke="#f59e0b" stroke-width="1.4"/><text x="792" y="579" font-size="15" font-weight="700" fill="#f2f4fa">refuses the end of the turn</text><text x="792" y="599" font-size="12" fill="#b0b2b8">Stop asks for evidence; after 3</text><text x="792" y="616" font-size="12" fill="#b0b2b8">refusals it becomes a warning, then lets go</text></g>
</svg>
