# CI do próprio aidlc-harness. Roda em pull_request e push na principal, só com leitura,
# sem segredo e sem dependência instalada (o kit não tem nenhuma).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Testes
        run: node --test
      - name: Todo .mjs parseia
        run: |
          find . -name '*.mjs' -not -path './node_modules/*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 node --check
      - name: Manifestos batem com o schema
        run: node scripts/check-quality-manifests.mjs
      - name: Plugin íntegro
        run: node scripts/check-plugin.mjs
      - name: Documentação consistente
        run: node scripts/check-docs-consistency.mjs
      - name: docs/pt-BR/PROMPTS.md em dia
        run: node scripts/gerar-prompts.mjs --check
      - name: Paginas por ferramenta em dia
        run: node scripts/gerar-ferramentas.mjs --check
      - name: Links do site resolvem
        run: node site/scripts/sync-docs.mjs --check
      - name: Diagramas em dia
        run: node scripts/gerar-diagramas.mjs --check
      - name: Referência cobre o que existe
        run: node scripts/check-reference.mjs
      - name: Documentação em inglês acompanha o português
        run: node scripts/check-i18n.mjs
      - name: Links dos documentos resolvem
        run: node scripts/check-links.mjs
      - name: Nenhum dado pessoal ou de infraestrutura
        run: node plugins/aidlc-harness/tools/aidlc-identity

  # O caminho de quem acabou de chegar, nos tres sistemas: setup, init, check, gate e doctor pelo PATH,
  # e a primeira execucao sem nada instalado (copia do kit no projeto, hooks, trivy baixado de verdade).
  maquina-limpa:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Maquina limpa
        run: node --test scripts/e2e-maquina-limpa.test.mjs scripts/setup.test.mjs scripts/pacote.test.mjs scripts/primeira-execucao.test.mjs plugins/aidlc-harness/lib/kit-no-projeto.test.mjs plugins/aidlc-harness/lib/trivy.test.mjs

  # O trivy que o kit baixa sozinho (versao e sha256 fixados em lib/trivy.mjs) existe e roda em
  # cada sistema oficial: o hash fixado de um sistema que nenhum teste baixa poderia estar errado.
  ci-gerado-trivy:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: O kit baixa o trivy, confere o hash e ele roda
        shell: bash
        run: |
          node --input-type=module -e "
            import { resolverTrivy } from './plugins/aidlc-harness/lib/trivy.mjs'
            import { execFileSync } from 'node:child_process'
            const env = { ...process.env, PATH: '' }
            const p = await resolverTrivy({ env, log: console.log })
            console.log(execFileSync(p, ['--version'], { encoding: 'utf8' }))
          "

  plugin-oficial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: claude plugin validate
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate ./plugins/aidlc-harness --strict
          claude plugin validate . --strict
